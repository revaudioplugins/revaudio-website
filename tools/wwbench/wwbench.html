<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TV Bench · Plugins</title>
<!-- TV bench (Dan 2026-10-14; the TV became the plugin browser on feat/home-library, 2026-10-18): tune the homepage
     TV (src/components/WordWall.astro). Both frames are the REAL dev homepage in same-origin iframes, scrolled to
     #plugins. This page drives them from outside: the wall's data-ww-* attributes, the page's own bench hooks
     (ww:select = light a plugin / pick a category / open a phone pane, ww:replay = the power-on, ww:glitch = one
     glitch now) and a live <style>
     setting its --ww-* properties. COPY SETTINGS when happy and hand it back ("apply ww bench"). -->
<style>
  :root { --bg: #0d0a12; --panel: #17121f; --line: #2c2338; --ink: #efe8f6; --dim: #a597b8; --acc: #d23cff; --acc-ink: #fbe9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0 8px 0 0; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  button, select { background: #221a2d; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #2d2340; }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -1px; padding: 9px 16px; font-weight: 600; letter-spacing: .06em; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: var(--acc); border-color: var(--acc); color: #1a0322; }
  .seg.small button { padding: 6px 10px; font-weight: 500; letter-spacing: 0; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #1a0322; font-weight: 700; letter-spacing: .04em; }
  button.big { padding: 9px 18px; font-weight: 700; letter-spacing: .06em; }
  .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .wrap { flex: 1; min-height: 0; display: flex; }
  aside { width: 320px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 12px 14px 24px; }
  aside h2 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  aside h2:first-child { margin-top: 0; }
  aside h2 small { font-size: 11px; letter-spacing: 0; text-transform: none; color: #7d7090; }
  .ctl { padding: 8px 0 6px; border-bottom: 1px solid #1f1829; }
  .ctl .top { display: flex; align-items: baseline; gap: 8px; }
  .ctl label { font-weight: 600; }
  .ctl .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--acc-ink); }
  .ctl .val.chg { color: #ffd27a; }
  .ctl .rs { padding: 1px 7px; border-radius: 6px; font-size: 12px; color: var(--dim); }
  .ctl .hint { color: #8d80a0; font-size: 12px; margin-top: 1px; }
  .ctl input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--acc); height: 22px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; background: currentColor; box-shadow: 0 0 8px currentColor; }
  main { flex: 1; min-width: 0; display: flex; gap: 14px; padding: 12px; overflow: hidden; }
  .stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stage[hidden] { display: none; }
  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .bar .note { color: #8d80a0; font-size: 12px; }
  .vp { position: relative; flex: none; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #050307; }
  .vp iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #050307; }
  .toast { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; padding: 10px 16px; border-radius: 8px; background: var(--acc); color: #1a0322;
    font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>TV bench · Plugins</h1>
  <span class="seg small" id="bg" title="What the whole wall is: the garage wood, or one TV every plugin plays on">
    <button data-b="wood">WOOD WALL</button><button data-b="screen">SCREEN WALL</button>
  </span>
  <span class="seg small" id="frame" title="The screen wall's frame: the brass rails, or one of three broken TVs">
    <button data-fr="rails">RAILS</button><button data-fr="1">BROKEN TV 1</button><button data-fr="2">BROKEN TV 2</button><button data-fr="3">BROKEN TV 3</button>
  </span>
  <span class="seg small" id="dir" title="The one way every plugin comes onto the screen (and the old one leaves)">
    <button data-dir="1" title="RISE: every plugin rises a few px into place; the old one lifts away as it fades">RISE</button><button data-dir="-1" title="DROP: every plugin comes down a few px into place, like the crane's door; the old one sinks away as it fades">DROP</button>
  </span>
  <button class="big" id="replay" title="The TV's power-on again">▶ REPLAY</button>
  <span class="seg small" id="view">
    <button data-v="both">Both</button><button data-v="laptop">Laptop</button><button data-v="phone">Phone</button>
  </span>
  <span class="spacer"></span>
  <button class="primary" id="copy">COPY SETTINGS</button>
  <button id="resetAll">RESET</button>
</header>
<header>
  <span class="lbl">Category</span>
  <span class="seg small" id="cat" title="Pick a category on both TVs (as a visitor would)"></span>
  <span class="lbl">Light</span>
  <span class="seg small" id="show" title="Light a plugin on both TVs (a channel change)"></span>
  <span class="lbl">Phone shows</span>
  <span class="seg small" id="pview" title="The phone shows one pane at a time: the list, or the lit plugin">
    <button data-pv="list">LIST</button><button data-pv="panel">THE PLUGIN</button>
  </span>
  <button class="big" id="chan" title="Change channel: light the next plugin on both TVs">▶ CHANNEL</button>
  <span class="seg small" id="chg">
    <button data-x="slow" title="Play the channel change 4x slower (the bench only; COPY SETTINGS keeps the real times)">SLOW ×4</button><button data-x="auto" title="Change channel by itself every moment or so">AUTO</button>
  </span>
  <span class="lbl">Glitch</span>
  <span class="seg small" id="gl" title="One glitch now on both TVs (the TV does one by itself every so often)">
    <button data-gl="name" title="An unlit name jumps a few px with a red / cyan fringe">▶ NAME</button><button data-gl="picture" title="A band of the lit plugin's picture tears sideways">▶ PICTURE</button><button data-gl="screen" title="The whole screen: a flicker, and on the next press a band of light rolling down the glass">▶ SCREEN</button>
  </span>
</header>
<header>
  <span class="lbl">Menu line</span>
  <span class="seg small" id="menu" title="The category line at the top of the screen (the user 2026-11-01: bigger, bolder, with style, and the visitor knows what to do)">
    <button data-m="now" title="Today's line">NOW</button><button data-m="a" title="DRIFT's #hear: numbered steps (1 PICK A CATEGORY, 2 PICK A PLUGIN, 3 TRY IT FREE), the pixel step chips, the track-list cells, a segment-LCD count">A · DRIFT STEPS</button><button data-m="b" title="GAS 2: the station's script line, a PLUGINS enamel sign and the pump's backlit grade keys (the pressed one sinks and lights from inside)">B · GAS 2 KEYS</button><button data-m="c" title="The house: big Bebas like the plugin names, a blinking PICK A CATEGORY prompt, the pick in inverse video">C · CHANNEL GUIDE</button>
  </span>
  <span class="lbl">Reading</span>
  <span class="seg small" id="reading" title="The lit plugin's text: name, type, description, the five words, price, keys">
    <button data-r="now" title="Today's text">NOW</button><button data-r="a" title="Inter, bigger and bolder, tinted a little to the channel (the personas' pick: it reads easiest)">A · TINTED SANS</button><button data-r="b" title="DRIFT's mono (Share Tech Mono): the set's on-screen display">B · OSD MONO</button><button data-r="c" title="VT323: a screen face, the arcade preset's readout type">C · SCREEN FACE</button>
  </span>
</header>
<div class="wrap">
  <aside id="controls"></aside>
  <main>
    <section class="stage" data-f="laptop">
      <div class="bar"><b>Laptop</b> <select data-size></select><span class="note">click the names: they are the real page</span></div>
      <div class="vp"><iframe title="Homepage at laptop size"></iframe></div>
    </section>
    <section class="stage" data-f="phone">
      <div class="bar"><b>Phone</b> <select data-size></select><span class="note">tap a name = its pane</span></div>
      <div class="vp"><iframe title="Homepage at phone size"></iframe></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

(() => {

  document.querySelectorAll('#bg button').forEach((b) => (b.onclick = () => { st.bg = b.dataset.b; commit(); }));
  document.querySelectorAll('#frame button').forEach((b) => (b.onclick = () => { st.frame = b.dataset.fr; commit(); }));
  document.querySelectorAll('#dir button').forEach((b) => (b.onclick = () => { st.dir = +b.dataset.dir; commit(); nextChannel(); }));
  document.querySelectorAll('#view button').forEach((b) => (b.onclick = () => { st.view = b.dataset.v; save(); layout(); }));
  document.querySelectorAll('#pview button').forEach((b) => (b.onclick = () => { st.pview = b.dataset.pv; save(); send('phone', 'ww:select', { view: st.pview }); paint(); }));
  document.querySelectorAll('#menu button').forEach((b) => (b.onclick = () => { st.menu = b.dataset.m; save(); dressAll(); paint(); }));
  document.querySelectorAll('#reading button').forEach((b) => (b.onclick = () => { st.reading = b.dataset.r; save(); dressAll(); paint(); }));
  document.getElementById('replay').onclick = () => each((g) => g('ww:replay'));
  // ▶ CHANNEL: the next plugin the page shows in its category, on both TVs
  const nextChannel = () => {
    const d = stages.laptop.ready ? stages.laptop.iframe.contentDocument : null;
    const shown = d ? [...d.querySelectorAll('[data-ww-item]')].filter((li) => !li.hidden).map((li) => li.dataset.wwItem) : null;
    const order = [...document.querySelectorAll('#show button')].map((b) => b.dataset.s).filter((s) => !shown || shown.includes(s));
    if (!order.length) return;
    lit = order[(order.indexOf(lit) + 1) % order.length];
    light();
  };
  document.getElementById('chan').onclick = nextChannel;
  // ▶ NAME / PICTURE / SCREEN: one glitch now on both TVs (at rest); SCREEN takes turns: a flicker, then a roll
  let roll = false;
  document.querySelectorAll('#gl button').forEach((b) => (b.onclick = () => {
    let kind = b.dataset.gl;
    if (kind === 'screen') { kind = roll ? 'roll' : 'flicker'; roll = !roll; }
    each((g) => g('ww:glitch', { kind }));
  }));
  document.querySelectorAll('#chg button').forEach((b) => (b.onclick = () => {
    if (b.dataset.x === 'slow') { slow = !slow; commit(); return; }
    if (auto) { clearTimeout(auto); auto = 0; paint(); return; }
    const tick = () => { nextChannel(); auto = setTimeout(tick, slow ? 2600 : 1400); };
    tick();
    paint();
  }));
  document.getElementById('resetAll').onclick = () => {
    if (!confirm('Back to the defaults in WordWall.astro? (your bench values are lost)')) return;
    st.cur = {}; st.bg = null; st.frame = null; st.dir = null; commit(); toast('Back to the defaults');
  };

  // ── hand-back: the wall's switches + every value (defaults included), ready to bake
  function settings() {
    const values = {};
    ALL.forEach((c) => (values[c.p] = `${+(+val(c.p)).toFixed(4)}${c.unit === 'px' ? 'px' : ''}`));
    return {
      bench: 'wwbench', note: 'apply ww bench: bake bg -> WALL_BG, frame -> WALL_FRAME, dir -> --ww-mv-dir (1 RISE, -1 DROP) and values -> the --ww-* defaults in WordWall.astro (the plugin-list values are the laptop\'s)',
      date: new Date().toISOString(), bg: bgv(), frame: framev(), dir: dirv(), menu: st.menu || 'now', reading: st.reading || 'now',
      values, changed: Object.keys(st.cur).filter((p) => src && Math.abs(st.cur[p] - src[p]) > 1e-6),
    };
  }
  window.__wwbench = settings;
  document.getElementById('copy').onclick = async () => {
    const text = JSON.stringify(settings(), null, 2);
    try { await navigator.clipboard.writeText(text); toast('Settings copied. Paste them back to Claude: "apply ww bench"'); }
    catch (e) { console.log(text); toast('Clipboard blocked: the settings are in the console'); }
  };
  let tt;
  function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

  buildControls();
  layout();
})();
</script>
</body>
</html>
