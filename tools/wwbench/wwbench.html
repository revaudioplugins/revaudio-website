<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Word Wall Bench · DRIFT</title>
<!-- Word-wall bench (Dan 2026-10-14): tune the homepage word wall's DRIFT panel (src/components/WordWall.astro).
     Both frames are the REAL dev homepage in same-origin iframes, scrolled to #sound with the DRIFT panel showing.
     This page drives them from outside: the panel's data-ww-look + a live <style> setting its --ww-* properties.
     Hover the laptop frame = steer · REPLAY = power-on flicker + the phone's drift-in · COPY SETTINGS when happy and
     hand it back ("apply ww bench"). -->
<style>
  :root { --bg: #0d0a12; --panel: #17121f; --line: #2c2338; --ink: #efe8f6; --dim: #a597b8; --acc: #d23cff; --acc-ink: #fbe9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0 8px 0 0; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  button, select { background: #221a2d; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #2d2340; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; padding: 9px 16px; font-weight: 600; letter-spacing: .06em; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: var(--acc); border-color: var(--acc); color: #1a0322; }
  .seg.small button { padding: 6px 10px; font-weight: 500; letter-spacing: 0; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #1a0322; font-weight: 700; letter-spacing: .04em; }
  button.big { padding: 9px 18px; font-weight: 700; letter-spacing: .06em; }
  .spacer { flex: 1; }
  .wrap { flex: 1; min-height: 0; display: flex; }
  aside { width: 320px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 12px 14px 24px; }
  aside h2 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  aside h2:first-child { margin-top: 0; }
  aside h2 small { font-size: 11px; letter-spacing: 0; text-transform: none; color: #7d7090; }
  .grp.off { opacity: .45; }
  .ctl { padding: 8px 0 6px; border-bottom: 1px solid #1f1829; }
  .ctl .top { display: flex; align-items: baseline; gap: 8px; }
  .ctl label { font-weight: 600; }
  .ctl .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--acc-ink); }
  .ctl .val.chg { color: #ffd27a; }
  .ctl .rs { padding: 1px 7px; border-radius: 6px; font-size: 12px; color: var(--dim); }
  .ctl .hint { color: #8d80a0; font-size: 12px; margin-top: 1px; }
  .ctl input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--acc); height: 22px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; background: currentColor; box-shadow: 0 0 8px currentColor; }
  main { flex: 1; min-width: 0; display: flex; gap: 14px; padding: 12px; overflow: hidden; }
  .stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stage[hidden] { display: none; }
  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .bar .note { color: #8d80a0; font-size: 12px; }
  .vp { position: relative; flex: none; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #050307; }
  .vp iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #050307; }
  .toast { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; padding: 10px 16px; border-radius: 8px; background: var(--acc); color: #1a0322;
    font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Word wall bench · DRIFT</h1>
  <span class="seg" id="look" title="Which DRIFT look the word wall shows">
    <button data-l="current">CURRENT</button><button data-l="neon">NEON</button><button data-l="steer">STEER</button><button data-l="both">BOTH</button>
  </span>
  <span class="seg small" id="bg" title="What the wall behind the DRIFT panel is">
    <button data-b="wood">WOOD WALL</button><button data-b="screen">SCREEN WALL</button>
  </span>
  <span class="seg small" id="win" title="The plugin window: plain, or on the /drift TV">
    <button data-w="plain">PLAIN WINDOW</button><button data-w="tv">TV WINDOW</button>
  </span>
  <span class="seg small" id="frame" title="The screen wall's frame: the brass rails, or one of three broken TVs">
    <button data-fr="rails">RAILS</button><button data-fr="1">BROKEN TV 1</button><button data-fr="2">BROKEN TV 2</button><button data-fr="3">BROKEN TV 3</button>
  </span>
  <button class="big" id="replay" title="Power-on flicker again, and the phone's drift-in">▶ REPLAY</button>
  <span class="seg small" id="show" title="Compare with the other plugins' panels">
    <button data-s="drift">DRIFT</button><button data-s="revlimiter">RevLimiter</button><button data-s="gas">GAS</button><button data-s="radio-roulette">Radio Roulette</button>
  </span>
  <span class="seg small" id="view">
    <button data-v="both">Both</button><button data-v="laptop">Laptop</button><button data-v="phone">Phone</button>
  </span>
  <span class="spacer"></span>
  <button class="primary" id="copy">COPY SETTINGS</button>
  <button id="resetAll">RESET</button>
</header>
<div class="wrap">
  <aside id="controls"></aside>
  <main>
    <section class="stage" data-f="laptop">
      <div class="bar"><b>Laptop</b> <select data-size></select><span class="note">hover = steer</span></div>
      <div class="vp"><iframe title="Homepage at laptop size"></iframe></div>
    </section>
    <section class="stage" data-f="phone">
      <div class="bar"><b>Phone</b> <select data-size></select><span class="note">touch: drift-in once</span></div>
      <div class="vp"><iframe title="Homepage at phone size"></iframe></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const KEY = 'wwbench:v1';
  const PANEL = ".ww-panel[data-ww-panel='drift']";

  // every tunable: the custom property on the DRIFT panel, its label, range, unit and which look uses it
  const GROUPS = [
    { id: 'neon', title: 'Neon sign', looks: ['neon', 'both'], ctl: [
      { p: '--ww-neon-h', label: 'Tube colour', hint: 'hue: 301 = DRIFT magenta, lower = violet, higher = pink', min: 250, max: 345, step: 1, unit: '' },
      { p: '--ww-neon-core', label: 'Core brightness', hint: 'how white-hot the lit tube is (never pure white)', min: 70, max: 97, step: 1, unit: '%' },
      { p: '--ww-neon-glow', label: 'Glow size', hint: 'how far the glow reaches round the letters', min: 0, max: 2.5, step: 0.05, unit: '×' },
      { p: '--ww-neon-spill', label: 'Light on the wall', hint: 'the lit tube\'s light spilling onto the wood', min: 0, max: 1, step: 0.01, unit: '' },
      { p: '--ww-neon-off', label: 'Unlit glass', hint: 'how visible the unlit glass tubes are', min: 0, max: 1, step: 0.01, unit: '' },
    ] },
    { id: 'steer', title: 'Steering', looks: ['steer', 'both'], ctl: [
      { p: '--ww-steer-travel', label: 'How far it slides', hint: 'SLIDING at full lock; the other words less', min: 0, max: 120, step: 1, unit: 'px' },
      { p: '--ww-steer-k', label: 'Spring stiffness', hint: 'higher = snappier, lower = lazier', min: 20, max: 400, step: 5, unit: '' },
      { p: '--ww-steer-damp', label: 'Damping', hint: '1 = no bounce, lower = more overshoot', min: 0.2, max: 1.5, step: 0.01, unit: '' },
      { p: '--ww-steer-spread', label: 'Lag between words', hint: '0 = all move together; higher = lower words lag more', min: 0, max: 1.5, step: 0.05, unit: '' },
      { p: '--ww-steer-skew', label: 'Lean when sliding', hint: 'SLIDING leans with its speed (degrees per 100 px/s)', min: 0, max: 3, step: 0.05, unit: '°' },
      { p: '--ww-skid', label: 'Skid marks', hint: 'the burnt-rubber smear SLIDING leaves', min: 0, max: 1, step: 0.01, unit: '' },
      { p: '--ww-steer-entry', label: 'Phone slide-in distance', hint: 'how far off the side the words drift in from', min: 0, max: 300, step: 5, unit: 'px' },
    ] },
    { id: 'screen', title: 'Screen wall', looks: ['neon', 'steer', 'both'], ctl: [
      { p: '--ww-scr-bright', label: 'Screen glow', hint: 'how lit the violet screen behind is', min: 0.3, max: 1.8, step: 0.01, unit: '×' },
      { p: '--ww-scr-scan', label: 'Screen scanlines', hint: 'how dark the CRT lines over the whole wall are', min: 0, max: 0.6, step: 0.01, unit: '' },
    ] },
    { id: 'frame', title: 'Broken TV frame', looks: ['neon', 'steer', 'both'], ctl: [
      { p: '--ww-frame-size', label: 'Frame size', hint: 'bezel thickness; stops growing once the side bezel would reach the words (about 0.25 on a 1141-1280 laptop, more on wide screens, thin on phones)', min: 0.1, max: 0.4, step: 0.005, unit: '' },
      { p: '--ww-frame-gap', label: 'Wood around the TV', hint: '0 = the TV fills the wall; more = it hangs on the garage wood (laptop only; the bezel thins to keep clear of the words)', min: 0, max: 48, step: 1, unit: 'px' },
    ] },
    { id: 'tv', title: 'TV window', looks: ['neon', 'steer', 'both'], ctl: [
      { p: '--ww-tv-size', label: 'TV frame size', hint: 'the bezel vs the /drift TV (phones get a thinner one)', min: 0.4, max: 1.1, step: 0.01, unit: '×' },
      { p: '--ww-tv-scan', label: 'Scanlines', hint: 'how dark the CRT lines over the picture are', min: 0, max: 0.6, step: 0.01, unit: '' },
    ] },
  ];
  const ALL = GROUPS.flatMap((g) => g.ctl);
  const SIZES = {
    laptop: [[1280, 665], [1141, 636, "Dan's laptop"], [1440, 900], [1728, 1000]],
    phone: [[390, 844], [360, 740], [430, 932]],
  };

  let st = { look: null, bg: null, win: null, frame: null, view: 'both', size: { laptop: 0, phone: 0 }, cur: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur) st = Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  let src = null;          // the defaults in WordWall.astro, read from the first frame that loads
  let srcLook = 'both';    // DRIFT_LOOK as built
  const fmt = (c, v) => (c.step < 1 ? (+v).toFixed(2) : String(Math.round(v))) + c.unit;
  const val = (p) => (p in st.cur ? st.cur[p] : src ? src[p] : NaN);
  const look = () => st.look || srcLook;
  let srcBg = 'screen', srcWin = 'plain'; // DRIFT_BG / DRIFT_WIN as built
  const bgv = () => st.bg || srcBg;
  const winv = () => st.win || srcWin;
  let srcFrame = '2'; // DRIFT_FRAME as built
  const framev = () => st.frame || srcFrame;

  // the frames: no cookie banner, no welcome pop-up (session-only flags, same origin)
  try { sessionStorage.setItem('ra-popup-shown-s', '1'); sessionStorage.setItem('ra-welcome10-s', '1'); } catch (e) {}

  const stages = {};
  document.querySelectorAll('.stage').forEach((s) => {
    const f = s.dataset.f;
    stages[f] = { s, f, iframe: s.querySelector('iframe'), vp: s.querySelector('.vp'), size: s.querySelector('[data-size]'), ready: false };
    SIZES[f].forEach(([w, h, n], i) => stages[f].size.add(new Option(`${w}×${h}${n ? ' · ' + n : ''}`, i)));
    stages[f].size.value = st.size[f] || 0;
    stages[f].size.onchange = () => { st.size[f] = +stages[f].size.value; save(); layout(); setTimeout(() => toSound(f), 120); };
    stages[f].iframe.src = '/?wwbench=' + f;
    waitFor(f);
  });

  // ── the controls
  const aside = document.getElementById('controls');
  function buildControls() {
    aside.innerHTML = '';
    GROUPS.forEach((g) => {
      const box = document.createElement('div');
      box.className = 'grp'; box.dataset.g = g.id;
      box.innerHTML = `<h2>${g.title} <small>(${g.looks.map((l) => l.toUpperCase()).join(' / ')})</small></h2>`;
      g.ctl.forEach((c) => {
        const row = document.createElement('div');
        row.className = 'ctl';
        row.innerHTML = `<div class="top"><label>${c.p === '--ww-neon-h' ? '<span class="sw"></span>' : ''}${c.label}</label>` +
          `<span class="val"></span><button class="rs" title="back to the default">↺</button></div>` +
          `<div class="hint">${c.hint}</div><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label}">`;
        const inp = row.querySelector('input');
        inp.oninput = () => { st.cur[c.p] = +inp.value; commit(); };
        row.querySelector('.rs').onclick = () => { delete st.cur[c.p]; commit(); };
        c.row = row;
        box.appendChild(row);
      });
      aside.appendChild(box);
    });
  }
  function paint() {
    ALL.forEach((c) => {
      const v = val(c.p);
      const inp = c.row.querySelector('input');
      if (document.activeElement !== inp && Number.isFinite(v)) inp.value = v;
      const out = c.row.querySelector('.val');
      out.textContent = Number.isFinite(v) ? fmt(c, v) : '…';
      out.classList.toggle('chg', c.p in st.cur && src && Math.abs(st.cur[c.p] - src[c.p]) > 1e-6);
      if (c.p === '--ww-neon-h') c.row.querySelector('.sw').style.color = `hsl(${v} 86% 62%)`;
    });
    document.querySelectorAll('.grp').forEach((g) => {
      const grp = GROUPS.find((x) => x.id === g.dataset.g);
      g.classList.toggle('off', !grp.looks.includes(look()));
    });
    document.querySelectorAll('#look button').forEach((b) => b.classList.toggle('on', b.dataset.l === look()));
    document.querySelectorAll('#bg button').forEach((b) => b.classList.toggle('on', b.dataset.b === bgv()));
    document.querySelectorAll('#win button').forEach((b) => b.classList.toggle('on', b.dataset.w === winv()));
    document.querySelectorAll('#frame button').forEach((b) => b.classList.toggle('on', b.dataset.fr === framev()));
    document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === st.view));
  }

  // ── layout: both frames fit the window; each iframe renders at its real size, scaled down
  function layout() {
    paint();
    stages.laptop.s.hidden = st.view === 'phone';
    stages.phone.s.hidden = st.view === 'laptop';
    const main = document.querySelector('main');
    const W = main.clientWidth - 24, H = main.clientHeight - 24;
    const dims = (f) => SIZES[f][st.size[f] || 0];
    const bar = (f) => stages[f].s.querySelector('.bar').offsetHeight + 8;
    let phoneW = 0;
    if (st.view !== 'laptop') {
      const [w, h] = dims('phone');
      const k = Math.min(1, (H - bar('phone')) / h, (st.view === 'phone' ? W : W * 0.3) / w);
      fit('phone', w, h, k);
      phoneW = Math.max(w * k, 200);
      stages.phone.s.style.width = phoneW + 'px';
    }
    if (st.view !== 'phone') {
      const [w, h] = dims('laptop');
      const k = Math.min(1, (H - bar('laptop')) / h, (W - (phoneW ? phoneW + 14 : 0)) / w);
      fit('laptop', w, h, k);
      stages.laptop.s.style.width = Math.max(w * k, 300) + 'px';
    }
  }
  function fit(f, w, h, k) {
    const { iframe, vp } = stages[f];
    iframe.style.width = w + 'px'; iframe.style.height = h + 'px'; iframe.style.transform = `scale(${k})`;
    vp.style.width = w * k + 'px'; vp.style.height = h * k + 'px';
  }
  addEventListener('resize', layout);

  // wire each frame as soon as its document is parsed (not on 'load': a lazy <video> can hold the load event)
  function waitFor(f, tries = 0) {
    const doc = stages[f].iframe.contentDocument;
    const ok = doc && doc.location.href !== 'about:blank' && doc.readyState !== 'loading' && doc.querySelector('[data-wordwall]');
    if (ok && stages[f].doc !== doc) return wire(f);
    if (tries < 200) setTimeout(() => waitFor(f, tries + 1), 150);
  }
  // ── one frame: read the defaults, pin DRIFT, scroll to the wall, take over the look + properties
  function wire(f) {
    const win = stages[f].iframe.contentWindow, doc = win.document;
    stages[f].doc = doc;
    const panel = doc.querySelector(PANEL);
    if (!panel) { toast('No DRIFT panel on the homepage (drift.homeLead off?)'); return; }
    const hide = doc.createElement('style');
    hide.textContent = '#cookie-banner { display: none !important; }';
    doc.head.appendChild(hide);
    if (!src) {
      const cs = win.getComputedStyle(panel);
      src = {};
      ALL.forEach((c) => (src[c.p] = parseFloat(cs.getPropertyValue(c.p))));
      srcLook = panel.dataset.wwLook || 'both';
      srcBg = panel.dataset.wwBg || 'screen';
      srcWin = panel.dataset.wwWin || 'plain';
      srcFrame = panel.dataset.wwFrame || '2';
    }
    // the phone frame is driven by a desktop mouse; tell the panel it is a touch screen (its own bench hook)
    if (f === 'phone') panel.dataset.wwInput = 'touch';
    const live = doc.createElement('style');
    live.id = 'wwb-live';
    doc.head.appendChild(live);
    stages[f].ready = true;
    commit();
    show(f, 'drift');
    setTimeout(() => toSound(f), 150);
  }
  function toSound(f) {
    const win = stages[f].iframe.contentWindow, doc = win && win.document;
    const panel = doc && doc.querySelector(PANEL);
    if (!panel) return;
    // the section's top edge (the TV frame's top corners: the checker and the tape), just under the nav
    const r = (doc.getElementById('sound') || panel).getBoundingClientRect();
    const nav = doc.querySelector('nav.site-nav, header');
    const navH = nav ? nav.getBoundingClientRect().height : 60;
    const top = win.scrollY + r.top - navH - 6;
    win.scrollTo({ top, behavior: 'instant' });
  }
  function show(f, slug) {
    const win = stages[f].iframe.contentWindow;
    if (!win || !stages[f].ready) return;
    win.document.dispatchEvent(new win.CustomEvent('showcase:change', { detail: { slug } }));
  }
  function replay(f) {
    const win = stages[f].iframe.contentWindow;
    const panel = win && win.document.querySelector(PANEL);
    if (panel) panel.dispatchEvent(new win.CustomEvent('ww:replay'));
  }

  // ── write the look + the live properties into both frames
  function commit() {
    ['laptop', 'phone'].forEach((f) => {
      if (!stages[f].ready) return;
      const doc = stages[f].iframe.contentDocument;
      const panel = doc.querySelector(PANEL);
      if (panel && panel.dataset.wwLook !== look()) panel.dataset.wwLook = look();
      if (panel && panel.dataset.wwBg !== bgv()) panel.dataset.wwBg = bgv();
      if (panel && panel.dataset.wwWin !== winv()) panel.dataset.wwWin = winv();
      if (panel && panel.dataset.wwFrame !== framev()) panel.dataset.wwFrame = framev();
      const body = Object.keys(st.cur).map((p) => `${p}: ${st.cur[p]}${unitOf(p)} !important;`).join(' ');
      doc.getElementById('wwb-live').textContent = body ? `${PANEL}, [data-wordwall] { ${body} }` : '';
    });
    save();
    paint();
  }
  const unitOf = (p) => (ALL.find((c) => c.p === p) || {}).unit === 'px' ? 'px' : '';

  document.querySelectorAll('#look button').forEach((b) => (b.onclick = () => { st.look = b.dataset.l; commit(); setTimeout(() => { replay('laptop'); replay('phone'); }, 60); }));
  document.querySelectorAll('#bg button').forEach((b) => (b.onclick = () => { st.bg = b.dataset.b; commit(); }));
  document.querySelectorAll('#win button').forEach((b) => (b.onclick = () => { st.win = b.dataset.w; commit(); }));
  document.querySelectorAll('#frame button').forEach((b) => (b.onclick = () => { st.frame = b.dataset.fr; commit(); }));
  document.querySelectorAll('#view button').forEach((b) => (b.onclick = () => { st.view = b.dataset.v; save(); layout(); }));
  document.querySelectorAll('#show button').forEach((b) => (b.onclick = () => {
    ['laptop', 'phone'].forEach((f) => show(f, b.dataset.s));
    document.querySelectorAll('#show button').forEach((x) => x.classList.toggle('on', x === b));
  }));
  document.getElementById('replay').onclick = () => { ['laptop', 'phone'].forEach((f) => { show(f, 'drift'); replay(f); }); document.querySelectorAll('#show button').forEach((x) => x.classList.toggle('on', x.dataset.s === 'drift')); };
  document.getElementById('resetAll').onclick = () => {
    if (!confirm('Back to the defaults in WordWall.astro? (your bench values are lost)')) return;
    st.cur = {}; st.look = null; st.bg = null; st.win = null; st.frame = null; commit(); toast('Back to the defaults');
  };

  // ── hand-back: the look + every value (defaults included), ready to bake
  function settings() {
    const values = {};
    ALL.forEach((c) => (values[c.p] = `${+(+val(c.p)).toFixed(4)}${c.unit === 'px' ? 'px' : ''}`));
    return {
      bench: 'wwbench', note: 'apply ww bench: bake look -> DRIFT_LOOK, bg -> DRIFT_BG, win -> DRIFT_WIN, frame -> DRIFT_FRAME and values -> the --ww-* defaults in WordWall.astro',
      date: new Date().toISOString(), look: look(), bg: bgv(), win: winv(), frame: framev(),
      values, changed: Object.keys(st.cur).filter((p) => src && Math.abs(st.cur[p] - src[p]) > 1e-6),
    };
  }
  window.__wwbench = settings;
  document.getElementById('copy').onclick = async () => {
    const text = JSON.stringify(settings(), null, 2);
    try { await navigator.clipboard.writeText(text); toast('Settings copied. Paste them back to Claude: "apply ww bench"'); }
    catch (e) { console.log(text); toast('Clipboard blocked: the settings are in the console'); }
  };
  let tt;
  function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

  buildControls();
  document.querySelector('#show button[data-s="drift"]').classList.add('on');
  layout();
})();
</script>
</body>
</html>
