<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TV Bench · Plugins</title>
<!-- TV bench (Dan 2026-10-14; the TV became the plugin browser on feat/home-library, 2026-10-18): tune the homepage
     TV (src/components/WordWall.astro). Both frames are the REAL dev homepage in same-origin iframes, scrolled to
     #plugins. This page drives them from outside: the wall's data-ww-* attributes, the page's own bench hooks
     (ww:select = light a plugin / pick a category / open a phone pane, ww:replay = the power-on, ww:glitch = one
     glitch now) and a live <style>
     setting its --ww-* properties. COPY SETTINGS when happy and hand it back ("apply ww bench"). -->
<style>
  :root { --bg: #0d0a12; --panel: #17121f; --line: #2c2338; --ink: #efe8f6; --dim: #a597b8; --acc: #d23cff; --acc-ink: #fbe9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0 8px 0 0; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  button, select { background: #221a2d; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #2d2340; }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -1px; padding: 9px 16px; font-weight: 600; letter-spacing: .06em; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: var(--acc); border-color: var(--acc); color: #1a0322; }
  .seg.small button { padding: 6px 10px; font-weight: 500; letter-spacing: 0; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #1a0322; font-weight: 700; letter-spacing: .04em; }
  button.big { padding: 9px 18px; font-weight: 700; letter-spacing: .06em; }
  .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .wrap { flex: 1; min-height: 0; display: flex; }
  aside { width: 320px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 12px 14px 24px; }
  aside h2 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  aside h2:first-child { margin-top: 0; }
  aside h2 small { font-size: 11px; letter-spacing: 0; text-transform: none; color: #7d7090; }
  .ctl { padding: 8px 0 6px; border-bottom: 1px solid #1f1829; }
  .ctl .top { display: flex; align-items: baseline; gap: 8px; }
  .ctl label { font-weight: 600; }
  .ctl .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--acc-ink); }
  .ctl .val.chg { color: #ffd27a; }
  .ctl .rs { padding: 1px 7px; border-radius: 6px; font-size: 12px; color: var(--dim); }
  .ctl .hint { color: #8d80a0; font-size: 12px; margin-top: 1px; }
  .ctl input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--acc); height: 22px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; background: currentColor; box-shadow: 0 0 8px currentColor; }
  main { flex: 1; min-width: 0; display: flex; gap: 14px; padding: 12px; overflow: hidden; }
  .stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stage[hidden] { display: none; }
  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar b { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .bar .note { color: #8d80a0; font-size: 12px; }
  .vp { position: relative; flex: none; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #050307; }
  .vp iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #050307; }
  .toast { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; padding: 10px 16px; border-radius: 8px; background: var(--acc); color: #1a0322;
    font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>TV bench · Plugins</h1>
  <span class="seg small" id="bg" title="What the whole wall is: the garage wood, or one TV every plugin plays on">
    <button data-b="wood">WOOD WALL</button><button data-b="screen">SCREEN WALL</button>
  </span>
  <span class="seg small" id="frame" title="The screen wall's frame: the brass rails, or one of three broken TVs">
    <button data-fr="rails">RAILS</button><button data-fr="1">BROKEN TV 1</button><button data-fr="2">BROKEN TV 2</button><button data-fr="3">BROKEN TV 3</button>
  </span>
  <span class="seg small" id="dir" title="The one way every plugin comes onto the screen (and the old one leaves)">
    <button data-dir="1" title="RISE: every plugin rises a few px into place; the old one lifts away as it fades">RISE</button><button data-dir="-1" title="DROP: every plugin comes down a few px into place, like the crane's door; the old one sinks away as it fades">DROP</button>
  </span>
  <button class="big" id="replay" title="The TV's power-on again">▶ REPLAY</button>
  <span class="seg small" id="view">
    <button data-v="both">Both</button><button data-v="laptop">Laptop</button><button data-v="phone">Phone</button>
  </span>
  <span class="spacer"></span>
  <button class="primary" id="copy">COPY SETTINGS</button>
  <button id="resetAll">RESET</button>
</header>
<header>
  <span class="lbl">Category</span>
  <span class="seg small" id="cat" title="Pick a category on both TVs (as a visitor would)"></span>
  <span class="lbl">Light</span>
  <span class="seg small" id="show" title="Light a plugin on both TVs (a channel change)"></span>
  <span class="lbl">Phone shows</span>
  <span class="seg small" id="pview" title="The phone shows one pane at a time: the list, or the lit plugin">
    <button data-pv="list">LIST</button><button data-pv="panel">THE PLUGIN</button>
  </span>
  <button class="big" id="chan" title="Change channel: light the next plugin on both TVs">▶ CHANNEL</button>
  <span class="seg small" id="chg">
    <button data-x="slow" title="Play the channel change 4x slower (the bench only; COPY SETTINGS keeps the real times)">SLOW ×4</button><button data-x="auto" title="Change channel by itself every moment or so">AUTO</button>
  </span>
  <span class="lbl">Glitch</span>
  <span class="seg small" id="gl" title="One glitch now on both TVs (the TV does one by itself every so often)">
    <button data-gl="name" title="An unlit name jumps a few px with a red / cyan fringe">▶ NAME</button><button data-gl="picture" title="A band of the lit plugin's picture tears sideways">▶ PICTURE</button><button data-gl="screen" title="The whole screen: a flicker, and on the next press a band of light rolling down the glass">▶ SCREEN</button>
  </span>
</header>
<div class="wrap">
  <aside id="controls"></aside>
  <main>
    <section class="stage" data-f="laptop">
      <div class="bar"><b>Laptop</b> <select data-size></select><span class="note">click the names: they are the real page</span></div>
      <div class="vp"><iframe title="Homepage at laptop size"></iframe></div>
    </section>
    <section class="stage" data-f="phone">
      <div class="bar"><b>Phone</b> <select data-size></select><span class="note">tap a name = its pane</span></div>
      <div class="vp"><iframe title="Homepage at phone size"></iframe></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const KEY = 'wwbench:v1'; // kept from the word-wall bench, so a frame pick saved there survives
  const WALL = '[data-wordwall]';

  // every tunable: the custom property on the wall (.ww), its label, range, unit and which frames it is written to
  const GROUPS = [
    { id: 'library', title: 'The plugin list', note: 'laptop', frames: ['laptop'], ctl: [
      { p: '--ww-list-share', label: 'List width', hint: 'the plugins\' share of the screen, %; the lit plugin takes the rest', min: 28, max: 56, step: 1, unit: '' },
      { p: '--ww-name-max', label: 'Biggest name', hint: 'rem; the names shrink below this to fit the column and the screen\'s height', min: 2.4, max: 6, step: 0.1, unit: '' },
      { p: '--ww-thumb-w', label: 'Thumbnail width', hint: 'rem', min: 3, max: 10, step: 0.1, unit: '' },
      { p: '--ww-dim', label: 'Unlit names', hint: 'how much the names that are not lit show (1 = as bright as the lit one\'s outline)', min: 0.2, max: 1, step: 0.01, unit: '' },
    ] },
    { id: 'screen', title: 'Screen', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-scr-bright', label: 'Screen glow', hint: 'how lit the tube behind is', min: 0.3, max: 1.8, step: 0.01, unit: '×' },
      { p: '--ww-scr-scan', label: 'Scanlines', hint: 'how dark the CRT lines on the glass are (the text and the pictures sit above them)', min: 0, max: 0.6, step: 0.01, unit: '' },
    ] },
    { id: 'channels', title: 'Channels: screen colour per plugin', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-ch-drift-h', label: 'DRIFT colour', hint: 'hue of DRIFT\'s type (its screen stays /drift\'s violet tube): 280 = violet', min: 240, max: 330, step: 1, unit: '' },
      { p: '--ww-ch-drift-s', label: 'DRIFT strength', hint: 'saturation: 0 = grey, higher = richer', min: 0, max: 100, step: 1, unit: '' },
      { p: '--ww-ch-revlimiter-h', label: 'RevLimiter colour', hint: 'hue: 26 = amber (keep above ~20: lower turns race-red)', min: 15, max: 60, step: 1, unit: '' },
      { p: '--ww-ch-revlimiter-s', label: 'RevLimiter strength', hint: 'saturation: 0 = grey, higher = richer', min: 0, max: 100, step: 1, unit: '' },
      { p: '--ww-ch-gas-h', label: 'GAS colour', hint: 'hue: 46 = brass gold', min: 15, max: 70, step: 1, unit: '' },
      { p: '--ww-ch-gas-s', label: 'GAS strength', hint: 'saturation: 0 = grey, higher = richer', min: 0, max: 100, step: 1, unit: '' },
      { p: '--ww-ch-radio-roulette-h', label: 'Radio Roulette colour', hint: 'hue: 38 = the dial glass cream', min: 0, max: 360, step: 1, unit: '' },
      { p: '--ww-ch-radio-roulette-s', label: 'Radio Roulette strength', hint: 'saturation: 0 = grey, higher = richer', min: 0, max: 100, step: 1, unit: '' },
    ] },
    { id: 'motion', title: 'Motion', note: 'RISE / DROP up top, ▶ CHANNEL to see it, SLOW ×4 to study it', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-mv-px', label: 'Travel', hint: 'px the new picture comes from (below on RISE, above on DROP)', min: 0, max: 40, step: 1, unit: '' },
      { p: '--ww-mv-in-ms', label: 'Coming on', hint: 'ms the new picture takes: it fades and travels as one, so it is solid only once it is in place', min: 120, max: 1000, step: 10, unit: '' },
      { p: '--ww-mv-out-px', label: 'Exit drift', hint: 'px the old plugin drifts the same way as it fades', min: 0, max: 20, step: 1, unit: '' },
      { p: '--ww-mv-out-ms', label: 'Exit time', hint: 'ms for the old plugin to leave', min: 60, max: 400, step: 10, unit: '' },
      { p: '--ww-mv-text-px', label: 'Text travel', hint: 'px the name, description, words and price come from, one after another, the same way as the picture', min: 0, max: 30, step: 1, unit: '' },
      { p: '--ww-mv-text-ms', label: 'Text time', hint: 'ms each text block takes', min: 100, max: 1000, step: 10, unit: '' },
      { p: '--ww-mv-text-gap-ms', label: 'Text one after another', hint: 'ms between the text blocks (0 = all at once)', min: 0, max: 150, step: 5, unit: '' },
      { p: '--ww-mv-text-at-ms', label: 'Text starts', hint: 'ms after the new plugin starts coming on', min: 0, max: 400, step: 10, unit: '' },
      { p: '--ww-mv-glow-dip', label: 'Screen dims', hint: 'how lit the screen stays while it is empty (1 = no dimming)', min: 0.3, max: 1, step: 0.01, unit: '' },
      { p: '--ww-mv-pane-px', label: 'Phone: slide', hint: 'px a tapped plugin slides in from the right (the list leaves half as far left); Back runs it backwards', min: 0, max: 60, step: 1, unit: '' },
      { p: '--ww-mv-pane-ms', label: 'Phone: exit time', hint: 'ms for the list / the plugin to leave on a tap / Back', min: 60, max: 500, step: 10, unit: '' },
    ] },
    { id: 'glitch', title: 'Glitch', note: '▶ NAME / PICTURE / SCREEN up top to see one now; SLOW ×4 slows them too', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-gl-min-s', label: 'Every, from', hint: 's: the shortest wait between two glitches (each wait is random between this and the next one)', min: 2, max: 60, step: 1, unit: '' },
      { p: '--ww-gl-max-s', label: 'Every, to', hint: 's: the longest wait between two glitches', min: 2, max: 90, step: 1, unit: '' },
      { p: '--ww-gl-idle-s', label: 'Left alone for', hint: 's the TV must be left alone (no pointer, finger, key or wheel on it) before one comes', min: 0, max: 15, step: 0.5, unit: '' },
      { p: '--ww-gl-px', label: 'Jump', hint: 'px a name jumps and a band of the picture tears sideways', min: 1, max: 12, step: 1, unit: '' },
      { p: '--ww-gl-ms', label: 'Glitch time', hint: 'ms a name\'s jump, a tear and a flicker last', min: 60, max: 600, step: 10, unit: '' },
      { p: '--ww-gl-roll-ms', label: 'Roll time', hint: 'ms the band of light takes down the glass', min: 300, max: 3000, step: 50, unit: '' },
      { p: '--ww-gl-roll-light', label: 'Roll light', hint: 'how much the band lights the glass as it rolls (under the text)', min: 0.02, max: 0.3, step: 0.01, unit: '' },
      { p: '--ww-gl-chg-chance', label: 'On a channel change', hint: 'how often a change lands with a short tear: 0 = never, 1 = every time (▶ CHANNEL to see it)', min: 0, max: 1, step: 0.01, unit: '' },
    ] },
    { id: 'frame', title: 'Broken TV frame', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-frame-size', label: 'Frame size', hint: 'bezel thickness; stops growing once the side bezel would reach the menu or a name (about 0.25 on a 1141-1280 laptop, more on wide screens, thin on phones)', min: 0.1, max: 0.4, step: 0.005, unit: '' },
      { p: '--ww-frame-gap', label: 'Wood around the TV', hint: '0 = the TV fills the wall; more = it hangs on the garage wood (laptop only; the bezel thins to keep clear of the content)', min: 0, max: 48, step: 1, unit: 'px' },
    ] },
    { id: 'screen1', title: 'One screen', frames: ['laptop', 'phone'], ctl: [
      { p: '--ww-breath', label: 'Breathing room', hint: 'glass showing above and below the content; more = smaller names and window', min: 0, max: 48, step: 1, unit: 'px' },
      { p: '--ww-snap-zone', label: 'Lock zone', hint: 'how close the TV has to stop for the scroll to lock onto it, in % of the screen (0 = never); scroll inside the laptop frame to feel it', min: 0, max: 60, step: 1, unit: '%' },
    ] },
  ];
  const ALL = GROUPS.flatMap((g) => g.ctl.map((c) => Object.assign(c, { frames: g.frames })));
  const SIZES = {
    laptop: [[1280, 665], [1141, 636, "Dan's laptop"], [1440, 900], [1728, 1000]],
    phone: [[390, 844], [375, 667, 'iPhone SE'], [360, 740], [430, 932]],
  };

  let st = { bg: null, frame: null, dir: null, view: 'both', pview: 'list', size: { laptop: 0, phone: 0 }, cur: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur) st = Object.assign(st, s); } catch (e) {}
  // the word-wall bench's looks, steering, neon and TV-window values, the static's (2026-10-18: no noise any more)
  // and TUNE / GEAR CHANGE's (2026-10-19: one motion) have no page to drive
  Object.keys(st.cur).forEach((p) => { if (!ALL.some((c) => c.p === p)) delete st.cur[p]; });
  delete st.look; delete st.win; delete st.snow; delete st.motion;
  // the motion was retuned smaller and shorter (2026-10-19): its values saved before then would hide the new defaults
  if (st.mv !== 2) { Object.keys(st.cur).forEach((p) => { if (p.startsWith('--ww-mv-')) delete st.cur[p]; }); st.mv = 2; }
  st.size.phone = Math.min(st.size.phone || 0, SIZES.phone.length - 1);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  let src = null; // the defaults in WordWall.astro, read off the laptop frame's wall (the phone frame has phone values)
  const fmt = (c, v) => (c.step < 1 ? (+v).toFixed(2) : String(Math.round(v))) + c.unit;
  const val = (p) => (p in st.cur ? st.cur[p] : src ? src[p] : NaN);
  let srcBg = 'screen', srcFrame = '2', srcDir = 1; // WALL_BG / WALL_FRAME / --ww-mv-dir as built
  const bgv = () => st.bg || srcBg;
  const framev = () => st.frame || srcFrame;
  const dirv = () => (st.dir === 1 || st.dir === -1 ? st.dir : srcDir);
  let lit = null, cat = 'all';
  let slow = false, auto = 0; // the channel change: SLOW x4 and AUTO (not saved: a reload starts at real speed, still)

  // the frames: no cookie banner, no welcome pop-up (session-only flags, same origin)
  try { sessionStorage.setItem('ra-popup-shown-s', '1'); sessionStorage.setItem('ra-welcome10-s', '1'); } catch (e) {}

  const stages = {};
  document.querySelectorAll('.stage').forEach((s) => {
    const f = s.dataset.f;
    stages[f] = { s, f, iframe: s.querySelector('iframe'), vp: s.querySelector('.vp'), size: s.querySelector('[data-size]'), ready: false };
    SIZES[f].forEach(([w, h, n], i) => stages[f].size.add(new Option(`${w}×${h}${n ? ' · ' + n : ''}`, i)));
    stages[f].size.value = st.size[f] || 0;
    stages[f].size.onchange = () => { st.size[f] = +stages[f].size.value; save(); layout(); setTimeout(() => toPlugins(f), 120); };
    stages[f].iframe.src = '/?wwbench=' + f;
    waitFor(f);
  });

  // ── the controls
  const aside = document.getElementById('controls');
  function buildControls() {
    aside.innerHTML = '';
    GROUPS.forEach((g) => {
      const box = document.createElement('div');
      box.className = 'grp'; box.dataset.g = g.id;
      box.innerHTML = `<h2>${g.title}${g.note ? ` <small>(${g.note})</small>` : ''}</h2>`;
      g.ctl.forEach((c) => {
        const row = document.createElement('div');
        row.className = 'ctl';
        const swatch = /^--ww-ch-.*-h$/.test(c.p);
        row.innerHTML = `<div class="top"><label>${swatch ? '<span class="sw"></span>' : ''}${c.label}</label>` +
          `<span class="val"></span><button class="rs" title="back to the default">↺</button></div>` +
          `<div class="hint">${c.hint}</div><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label}">`;
        const inp = row.querySelector('input');
        inp.oninput = () => { st.cur[c.p] = +inp.value; commit(); };
        row.querySelector('.rs').onclick = () => { delete st.cur[c.p]; commit(); };
        c.row = row;
        box.appendChild(row);
      });
      aside.appendChild(box);
    });
  }
  function paint() {
    ALL.forEach((c) => {
      const v = val(c.p);
      const inp = c.row.querySelector('input');
      if (document.activeElement !== inp && Number.isFinite(v)) inp.value = v;
      const out = c.row.querySelector('.val');
      out.textContent = Number.isFinite(v) ? fmt(c, v) : '…';
      out.classList.toggle('chg', c.p in st.cur && src && Math.abs(st.cur[c.p] - src[c.p]) > 1e-6);
      const sw = c.row.querySelector('.sw');
      if (sw) sw.style.color = `hsl(${v} ${val(c.p.replace(/-h$/, '-s'))}% 62%)`;
    });
    document.querySelectorAll('#bg button').forEach((b) => b.classList.toggle('on', b.dataset.b === bgv()));
    document.querySelectorAll('#frame button').forEach((b) => b.classList.toggle('on', b.dataset.fr === framev()));
    document.querySelectorAll('#dir button').forEach((b) => b.classList.toggle('on', +b.dataset.dir === dirv()));
    document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === st.view));
    document.querySelectorAll('#pview button').forEach((b) => b.classList.toggle('on', b.dataset.pv === st.pview));
    document.querySelectorAll('#cat button').forEach((b) => b.classList.toggle('on', b.dataset.c === cat));
    document.querySelectorAll('#show button').forEach((b) => b.classList.toggle('on', b.dataset.s === lit));
    document.querySelectorAll('#chg button').forEach((b) => b.classList.toggle('on', b.dataset.x === 'slow' ? slow : !!auto));
  }

  // ── layout: both frames fit the window; each iframe renders at its real size, scaled down
  function layout() {
    paint();
    stages.laptop.s.hidden = st.view === 'phone';
    stages.phone.s.hidden = st.view === 'laptop';
    const main = document.querySelector('main');
    const W = main.clientWidth - 24, H = main.clientHeight - 24;
    const dims = (f) => SIZES[f][st.size[f] || 0];
    const bar = (f) => stages[f].s.querySelector('.bar').offsetHeight + 8;
    let phoneW = 0;
    if (st.view !== 'laptop') {
      const [w, h] = dims('phone');
      const k = Math.min(1, (H - bar('phone')) / h, (st.view === 'phone' ? W : W * 0.3) / w);
      fit('phone', w, h, k);
      phoneW = Math.max(w * k, 200);
      stages.phone.s.style.width = phoneW + 'px';
    }
    if (st.view !== 'phone') {
      const [w, h] = dims('laptop');
      const k = Math.min(1, (H - bar('laptop')) / h, (W - (phoneW ? phoneW + 14 : 0)) / w);
      fit('laptop', w, h, k);
      stages.laptop.s.style.width = Math.max(w * k, 300) + 'px';
    }
  }
  function fit(f, w, h, k) {
    const { iframe, vp } = stages[f];
    iframe.style.width = w + 'px'; iframe.style.height = h + 'px'; iframe.style.transform = `scale(${k})`;
    vp.style.width = w * k + 'px'; vp.style.height = h * k + 'px';
  }
  addEventListener('resize', layout);

  // wire each frame as soon as its document is parsed (not on 'load': a lazy <video> can hold the load event)
  function waitFor(f, tries = 0) {
    const doc = stages[f].iframe.contentDocument;
    const ok = doc && doc.location.href !== 'about:blank' && doc.readyState !== 'loading' && doc.querySelector(WALL);
    if (ok && stages[f].doc !== doc) return wire(f);
    if (tries < 200) setTimeout(() => waitFor(f, tries + 1), 150);
  }
  // ── one frame: read the defaults (laptop), build the category + plugin buttons from the page, scroll to the TV
  function wire(f) {
    const win = stages[f].iframe.contentWindow, doc = win.document;
    stages[f].doc = doc;
    const wallEl = doc.querySelector(WALL);
    const hide = doc.createElement('style');
    hide.textContent = '#cookie-banner { display: none !important; }';
    doc.head.appendChild(hide);
    if (!src && f === 'laptop') {
      const cs = win.getComputedStyle(wallEl);
      src = {};
      ALL.forEach((c) => (src[c.p] = parseFloat(cs.getPropertyValue(c.p))));
      srcBg = wallEl.dataset.wwBg || 'screen';
      srcFrame = wallEl.dataset.wwFrame || '2';
      srcDir = Math.sign(parseFloat(cs.getPropertyValue('--ww-mv-dir'))) || 1;
    }
    if (!document.querySelector('#show button')) {
      // the page's own categories + plugins, so the bench follows the data (library.ts) without an edit
      const catBox = document.getElementById('cat'), showBox = document.getElementById('show');
      doc.querySelectorAll('[data-ww-cat]').forEach((b) => {
        const x = document.createElement('button');
        x.dataset.c = b.dataset.wwCat; x.textContent = b.getAttribute('aria-label') || b.dataset.wwCat;
        x.onclick = () => { cat = x.dataset.c; each((g) => g('ww:select', { cat })); syncLit(); paint(); };
        catBox.appendChild(x);
      });
      doc.querySelectorAll('[data-ww-pick]').forEach((a) => {
        const x = document.createElement('button');
        x.dataset.s = a.dataset.wwPick; x.textContent = a.querySelector('.ww-name')?.textContent || a.dataset.wwPick;
        x.onclick = () => { lit = x.dataset.s; light(); };
        showBox.appendChild(x);
      });
      lit = wallEl.dataset.wwOn;
    }
    const live = doc.createElement('style');
    live.id = 'wwb-live';
    doc.head.appendChild(live);
    stages[f].ready = true;
    commit();
    if (lit) send(f, 'ww:select', { slug: lit, ...(f === 'phone' ? { view: st.pview } : {}) });
    setTimeout(() => toPlugins(f), 150);
  }
  function toPlugins(f) {
    const win = stages[f].iframe.contentWindow, doc = win && win.document;
    const sec = doc && doc.getElementById('plugins');
    if (!sec) return;
    // the section's top edge (the TV frame's top corners), just under the nav = the scroll lock's own target
    const nav = doc.querySelector('nav.site-nav, header');
    const navH = nav ? nav.getBoundingClientRect().height : 60;
    win.scrollTo({ top: win.scrollY + sec.getBoundingClientRect().top - navH, behavior: 'instant' });
  }
  function send(f, type, detail) {
    const win = stages[f].iframe.contentWindow;
    const wallEl = win && stages[f].ready && win.document.querySelector(WALL);
    if (wallEl) wallEl.dispatchEvent(new win.CustomEvent(type, { detail }));
  }
  const each = (fn) => ['laptop', 'phone'].forEach((f) => fn((type, detail) => send(f, type, detail), f));
  const light = () => { each((g, f) => g('ww:select', { slug: lit, ...(f === 'phone' ? { view: st.pview } : {}) })); syncLit(); paint(); };
  // after a category pick the page may light another plugin (the lit one was not in it): read it back from its lit
  // row (the pick, at once; data-ww-on follows only when the change lands, so it would undo a ▶ CHANNEL mid-change)
  const syncLit = () => { const d = stages.laptop.ready ? stages.laptop.iframe.contentDocument : null; lit = d?.querySelector('[data-ww-pick].is-lit')?.dataset.wwPick || d?.querySelector(WALL)?.dataset.wwOn || lit; };

  // ── write the wall's attributes + the live properties into both frames
  function commit() {
    ['laptop', 'phone'].forEach((f) => {
      if (!stages[f].ready) return;
      const doc = stages[f].iframe.contentDocument;
      const wallEl = doc.querySelector(WALL);
      if (wallEl && wallEl.dataset.wwBg !== bgv()) wallEl.dataset.wwBg = bgv();
      if (wallEl && wallEl.dataset.wwFrame !== framev()) wallEl.dataset.wwFrame = framev();
      const vals = {};
      Object.keys(st.cur)
        .filter((p) => (ALL.find((c) => c.p === p) || { frames: [] }).frames.includes(f))
        .forEach((p) => (vals[p] = st.cur[p]));
      if (st.dir === 1 || st.dir === -1) vals['--ww-mv-dir'] = st.dir; // RISE / DROP (else the page's own)
      // SLOW x4: every time of the motion, scaled in the frames only (the sliders and COPY keep the real ones)
      if (slow) ALL.filter((c) => /-ms$/.test(c.p)).forEach((c) => { const v = val(c.p); if (Number.isFinite(v)) vals[c.p] = v * 4; });
      const body = Object.keys(vals).map((p) => `${p}: ${vals[p]}${unitOf(p)} !important;`).join(' ');
      doc.getElementById('wwb-live').textContent = body ? `${WALL} { ${body} }` : '';
    });
    save();
    paint();
  }
  const unitOf = (p) => (ALL.find((c) => c.p === p) || {}).unit === 'px' ? 'px' : '';

  document.querySelectorAll('#bg button').forEach((b) => (b.onclick = () => { st.bg = b.dataset.b; commit(); }));
  document.querySelectorAll('#frame button').forEach((b) => (b.onclick = () => { st.frame = b.dataset.fr; commit(); }));
  document.querySelectorAll('#dir button').forEach((b) => (b.onclick = () => { st.dir = +b.dataset.dir; commit(); nextChannel(); }));
  document.querySelectorAll('#view button').forEach((b) => (b.onclick = () => { st.view = b.dataset.v; save(); layout(); }));
  document.querySelectorAll('#pview button').forEach((b) => (b.onclick = () => { st.pview = b.dataset.pv; save(); send('phone', 'ww:select', { view: st.pview }); paint(); }));
  document.getElementById('replay').onclick = () => each((g) => g('ww:replay'));
  // ▶ CHANNEL: the next plugin the page shows in its category, on both TVs
  const nextChannel = () => {
    const d = stages.laptop.ready ? stages.laptop.iframe.contentDocument : null;
    const shown = d ? [...d.querySelectorAll('[data-ww-item]')].filter((li) => !li.hidden).map((li) => li.dataset.wwItem) : null;
    const order = [...document.querySelectorAll('#show button')].map((b) => b.dataset.s).filter((s) => !shown || shown.includes(s));
    if (!order.length) return;
    lit = order[(order.indexOf(lit) + 1) % order.length];
    light();
  };
  document.getElementById('chan').onclick = nextChannel;
  // ▶ NAME / PICTURE / SCREEN: one glitch now on both TVs (at rest); SCREEN takes turns: a flicker, then a roll
  let roll = false;
  document.querySelectorAll('#gl button').forEach((b) => (b.onclick = () => {
    let kind = b.dataset.gl;
    if (kind === 'screen') { kind = roll ? 'roll' : 'flicker'; roll = !roll; }
    each((g) => g('ww:glitch', { kind }));
  }));
  document.querySelectorAll('#chg button').forEach((b) => (b.onclick = () => {
    if (b.dataset.x === 'slow') { slow = !slow; commit(); return; }
    if (auto) { clearTimeout(auto); auto = 0; paint(); return; }
    const tick = () => { nextChannel(); auto = setTimeout(tick, slow ? 2600 : 1400); };
    tick();
    paint();
  }));
  document.getElementById('resetAll').onclick = () => {
    if (!confirm('Back to the defaults in WordWall.astro? (your bench values are lost)')) return;
    st.cur = {}; st.bg = null; st.frame = null; st.dir = null; commit(); toast('Back to the defaults');
  };

  // ── hand-back: the wall's switches + every value (defaults included), ready to bake
  function settings() {
    const values = {};
    ALL.forEach((c) => (values[c.p] = `${+(+val(c.p)).toFixed(4)}${c.unit === 'px' ? 'px' : ''}`));
    return {
      bench: 'wwbench', note: 'apply ww bench: bake bg -> WALL_BG, frame -> WALL_FRAME, dir -> --ww-mv-dir (1 RISE, -1 DROP) and values -> the --ww-* defaults in WordWall.astro (the plugin-list values are the laptop\'s)',
      date: new Date().toISOString(), bg: bgv(), frame: framev(), dir: dirv(),
      values, changed: Object.keys(st.cur).filter((p) => src && Math.abs(st.cur[p] - src[p]) > 1e-6),
    };
  }
  window.__wwbench = settings;
  document.getElementById('copy').onclick = async () => {
    const text = JSON.stringify(settings(), null, 2);
    try { await navigator.clipboard.writeText(text); toast('Settings copied. Paste them back to Claude: "apply ww bench"'); }
    catch (e) { console.log(text); toast('Clipboard blocked: the settings are in the console'); }
  };
  let tt;
  function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

  buildControls();
  layout();
})();
</script>
</body>
</html>
