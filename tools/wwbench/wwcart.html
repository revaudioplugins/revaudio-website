<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TV Bench · Cart keys</title>
<!-- TV cart-keys bench (Dan 2026-11-24, on layout B: "take special care for the add to cart part, and the product page
     part ... make them special and not just like a regular button. Give me like 5 options, from our brand identity and
     design system"). Six same-origin iframes of the REAL dev homepage (layout B): today's two keys, then options 1-5,
     each one a <style> dropped into its frame (nothing in the page's code changes). The view is the keys at true size
     (KEYS) or the whole TV (TV). The plugin buttons light the same plugin everywhere; the cart switch shows every
     frame's Add to cart as "In your cart" the way Cart.astro does it (class + label, no real cart). Hover and click
     the keys: the frames are the real page. Pick in chat.
     Round 2 (Dan 2026-11-24 picked 5 Parts tag and 1 Fastext, "polish both"): the tag as worn, real-looking paper that
     falls off the glass when pressed, with paper physics; Fastext with pixel icons, a cart and three for Product page
     (a page, a magnifier, a tiny plugin). Round 1's five options are in git (d528a4b). -->
<style>
  :root { --bg: #0e0b09; --panel: #18120f; --line: #33261e; --ink: #f1e8df; --dim: #ab9b8c; --acc: #e0a35a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 3; background: var(--bg); }
  header h1 { margin: 0 6px 0 0; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  button { background: #241a15; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -1px; padding: 6px 10px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: var(--acc); border-color: var(--acc); color: #221004; font-weight: 700; }
  .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 22px 18px; padding: 16px; }
  .card { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .card[hidden] { display: none; }
  .head { display: flex; align-items: center; gap: 10px; }
  .badge { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--acc); color: #221004; font-weight: 800; }
  .card[data-o='today'] .badge { background: #2e231d; color: var(--ink); }
  .head h2 { margin: 0; font-size: 15px; letter-spacing: .04em; }
  .head .mine { color: var(--acc); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--acc); border-radius: 5px; padding: 3px 6px; }
  .head .zoom { margin-left: auto; padding: 4px 10px; font-size: 12px; }
  .line { margin: 0; color: var(--dim); font-size: 13px; max-width: 80ch; min-height: calc(3 * 1.35em); }
  .vp { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #050303; }
  .vp iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #050303; }
</style>
</head>
<body>
<header>
  <h1>TV bench · Cart keys</h1>
  <span class="lbl">Plugin</span>
  <span class="seg" id="chan" title="Light the same plugin in every TV (the free ones have no Add to cart)"></span>
  <span class="lbl">Cart</span>
  <span class="seg" id="cart" title="Show Add to cart as it looks once the plugin is in the cart">
    <button type="button" data-c="out">Not in cart</button><button type="button" data-c="in">In your cart</button>
  </span>
  <button type="button" id="empty" title="Take everything out of the real cart (pressing Add to cart puts the plugin in it) and reload the TVs, so the tag can fall again">Empty the cart</button>
  <span class="lbl">View</span>
  <span class="seg" id="view"><button type="button" data-v="keys" title="The keys at their real size">Keys</button><button type="button" data-v="tv" title="The whole TV, scaled">Whole TV</button></span>
  <span class="lbl">Screen</span>
  <span class="seg" id="size"><button data-s="1312x734" title="Chrome at 100 % on Dan's laptop">Chrome</button><button data-s="1141x636" title="Safari at 115 % on Dan's laptop">Safari</button></span>
  <span class="spacer"></span>
  <span class="lbl">Hover and click. Then tell Claude which Product page icon: 1a, 1b or 1c.</span>
</header>
<main id="cards"></main>

    radial-gradient(circle at .78rem 50%, #000 .17rem, transparent .19rem);
  background:
    radial-gradient(circle at .78rem 50%, transparent .19rem, #6f5428 .2rem, #e8c878 .26rem, #a3843f .31rem, #5b4520 .36rem, transparent .38rem),
    linear-gradient(97deg, transparent 54%, rgb(255 245 220 / .3) 54.4%, rgb(70 45 15 / .18) 55%, transparent 56%),
    radial-gradient(ellipse 13% 30% at 74% 66%, rgb(60 40 20 / .26), rgb(60 40 20 / .1) 60%, transparent 72%),
    ${GRAIN},
    ${BLOTCH} 0 0 / 100% 100%,
    radial-gradient(ellipse at 52% 46%, transparent 48%, rgb(120 82 30 / .5) 100%),
    linear-gradient(172deg, #dcc596, #cdb07a);
}
/* the masking tape that holds it to the glass */
${K}::after {
  content: ''; position: absolute; top: -.46rem; left: 55%; width: 2.7rem; height: .78rem; translate: -50% 0; rotate: -5deg;
  background: ${TAPE} center / 100% 100% no-repeat; opacity: .9; pointer-events: none;
  filter: sepia(.25) brightness(1.02) drop-shadow(0 1px 1px rgb(0 0 0 / .25));
}
${P} .ww-cart::after { left: 62%; rotate: 6deg; }
/* a draft catches it: it sways from the tape, the shadow opens under it */
${K}:hover {
  transform: rotate(var(--tilt));
  filter: drop-shadow(0 3px 2px rgb(0 0 0 / .42)) drop-shadow(0 12px 10px rgb(0 0 0 / .3));
  animation: wwp-draft 1.6s ease-in-out infinite;
}
@keyframes wwp-draft { 0%, 100% { rotate: 0deg; } 30% { rotate: 1.6deg; } 65% { rotate: -.7deg; } }
/* pressed flat against the glass */
${K}:is(:active, .is-pressed) { transform: rotate(var(--tilt)) scale(.985); filter: drop-shadow(0 1px 1px rgb(0 0 0 / .55)); animation: none; transition-duration: 60ms; }
/* once it's in the cart, the new tag says so in stamp ink */
${P} .ww-cart.is-in-cart { color: rgb(130 38 16 / .9); text-shadow: 0 0 .8px rgb(130 38 16 / .6); letter-spacing: .06em; }
/* the paper that fell is gone; a fresh one is slapped on in its place */
${K}.wwp-gone { visibility: hidden; }
${K}.wwp-stick { animation: wwp-stick 420ms cubic-bezier(.2, .9, .3, 1.15) both; }
${K}.wwp-stick::after { animation: wwp-tape 420ms steps(1, end) both; }
@keyframes wwp-stick {
  0% { opacity: 0; transform: rotate(calc(var(--tilt) + 7deg)) translateY(-10px) scale(1.1); filter: drop-shadow(0 16px 12px rgb(0 0 0 / .35)); }
  55% { opacity: 1; transform: rotate(var(--tilt)) scale(.98); filter: drop-shadow(0 2px 1.5px rgb(0 0 0 / .5)); }
  100% { transform: rotate(var(--tilt)) scale(1); }
}
@keyframes wwp-tape { 0%, 50% { opacity: 0; } 51%, 100% { opacity: .9; } }
${NOMOTION(`${K}:hover { animation: none; } ${K}.wwp-stick, ${K}.wwp-stick::after { animation: none; }`)}
`;

  /* The fall (the tag's frame only): a press lets the tape go. The paper swings on the corner still stuck, then
     flutters down like paper: gravity against air drag (it settles near 480 px/s), a sway and a wobble on one
     rhythm, a tilt toward and away from the glass, the shadow opening as it leaves the glass, then gone past the
     TV. It is a copy that falls, in a layer over the whole page (nothing on the TV clips it): the real key hides,
     then a fresh paper is taped on in its place (Add to cart: Cart.astro has made it "In your cart" by then).
     The bench holds the Product page link (the page would follow it once the card has fallen). Reduced motion:
     nothing falls. */
  const PAPER_SETUP = (doc, win) => {
    if (win.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const VARS = ['--ww-ch-h', '--ww-ch-s', '--ww-gs', '--ww-ink', '--ww-ink-hot', '--ww-ink-text', '--ww-ink-on', '--ww-glow', '--ww-glow-hot', '--ww-glow-soft', '--ww-glow-faint'];
    const drop = (key) => {
      const r = key.getBoundingClientRect();
      const pcs = win.getComputedStyle(key.closest('.ww-panel'));
      const host = doc.createElement('div');
      host.className = 'ww'; host.dataset.wwBg = 'screen'; host.setAttribute('aria-hidden', 'true');
      host.style.cssText = 'position:fixed;inset:0;z-index:2147483000;pointer-events:none;margin:0;padding:0;display:block;background:none;min-height:0;overflow:visible;';
      const pan = doc.createElement('div');
      pan.className = 'ww-panel';
      pan.style.cssText = 'position:absolute;inset:0;display:block;opacity:1;visibility:visible;margin:0;padding:0;';
      VARS.forEach((v) => pan.style.setProperty(v, pcs.getPropertyValue(v)));
      const buy = doc.createElement('div');
      buy.className = 'ww-buy';
      buy.style.cssText = 'position:absolute;left:0;top:0;display:block;margin:0;padding:0;will-change:transform;';
      const paper = key.cloneNode(true);
      paper.removeAttribute('id'); paper.classList.remove('wwp-gone', 'wwp-stick'); paper.tabIndex = -1;
      // not a cart key any more: Cart.astro relabels every [data-add-to-cart] on the page, the falling copy included
      ['data-add-to-cart', 'data-cart-label', 'data-slug'].forEach((a) => paper.removeAttribute(a));
      paper.style.animation = 'none';
      buy.appendChild(paper); pan.appendChild(buy); host.appendChild(pan); doc.body.appendChild(host);
      const c = paper.getBoundingClientRect();
      buy.style.left = `${r.left - c.left}px`; buy.style.top = `${r.top - c.top}px`;
      const side = Math.random() < 0.5 ? -1 : 1; // which corner the tape keeps a moment longer
      buy.style.transformOrigin = side > 0 ? '8% 0' : '92% 0';
      const H = win.innerHeight;
      const g = 2500, drag = 5.2, f = 1.35 + Math.random() * 0.45, amp = 20 + Math.random() * 12;
      let t = 0, x = 0, y = 0, vy = 0, phase = Math.random() * Math.PI, last = win.performance.now();
      const step = (now) => {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now; t += dt;
        let rot, rx = 0;
        if (t < 0.24) { // the tape lets go on one side: it swings on the other corner
          const k = t / 0.24;
          rot = side * 30 * Math.sin((k * Math.PI) / 2);
          y = 4 * k * k;
        } else {
          vy += (g - drag * vy) * dt;
          phase += 2 * Math.PI * f * dt;
          x += (side * 36 + 150 * Math.cos(phase)) * dt;
          y += vy * dt;
          rot = side * 30 + amp * Math.sin(phase);
          rx = 48 * Math.sin(phase * 1.3);
        }
        const away = Math.min(1, y / 260); // leaving the glass: the shadow opens and fades
        paper.style.filter = `drop-shadow(0 ${2 + away * 16}px ${1.5 + away * 12}px rgb(0 0 0 / ${0.45 - away * 0.25}))`;
        buy.style.transform = `perspective(700px) translate(${x}px, ${y}px) rotate(${rot}deg) rotateX(${rx}deg)`;
        const out = r.top + y > H + 40 || t > 2.6;
        buy.style.opacity = String(t > 2.1 ? Math.max(0, 1 - (t - 2.1) / 0.5) : 1);
        if (out) host.remove(); else win.requestAnimationFrame(step);
      };
      win.requestAnimationFrame(step);
    };
    doc.addEventListener('click', (e) => {
      const key = e.target.closest && e.target.closest('.ww-panel .ww-buy :is(.ww-more, .ww-cart)');
      if (!key || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (key.classList.contains('ww-cart') && key.classList.contains('is-in-cart')) return; // in the cart: the drawer opens
      if (key.classList.contains('ww-more')) e.preventDefault(); // the bench holds the link
      drop(key);
      key.classList.add('wwp-gone');
      win.setTimeout(() => {
        key.classList.remove('wwp-gone');
        key.classList.add('wwp-stick');
        win.setTimeout(() => key.classList.remove('wwp-stick'), 480);
      }, key.classList.contains('ww-cart') ? 700 : 1500);
    }, true); // capture: before Cart.astro's own click, which still runs and flips the label
  };

  const OPTS = [
    { id: 'tag', badge: '5', name: 'Parts tag, worn, falls', line: 'Worn paper: a rough edge, grain, a crease, stains, yellowed edges, an eyelet, masking tape. A draft sways it on hover. Press it and the tape lets go: it swings on one corner, then flutters down off the TV like real paper, and a new tag is taped on (Add to cart reads In your cart). The bench holds the Product page link so you can drop it again.', css: PAPER, setup: PAPER_SETUP },
    { id: 'fx-page', badge: '1a', name: 'Fastext · Page', line: 'A pixel cart on Add to cart. Product page is a page: a sheet with a folded corner and three lines of text.', css: FASTEXT(ICON.page) },
    { id: 'fx-loupe', badge: '1b', name: 'Fastext · Magnifier', line: 'A pixel cart on Add to cart. Product page is a magnifier: look closer.', css: FASTEXT(ICON.loupe) },
    { id: 'fx-plugin', badge: '1c', name: 'Fastext · Plugin', line: 'A pixel cart on Add to cart. Product page is a tiny plugin: a faceplate with two knobs and a meter, as in "see the plugin".', css: FASTEXT(ICON.plugin) },
  ];

  const st = Object.assign({ slug: 'revlimiter', size: '1312x734', zoom: '', view: 'keys', cart: 'out' },
    (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  try { if (!localStorage.getItem('ra-cookie-consent')) localStorage.setItem('ra-cookie-consent', 'declined'); } catch (e) {}

  const box = document.getElementById('cards');
  box.innerHTML = OPTS.map((o) => `
    <section class="card" data-o="${o.id}">
      <div class="head"><span class="badge">${o.badge}</span><h2>${o.name}</h2><span class="mine" hidden>Claude's pick</span><button class="zoom" type="button">Zoom</button></div>
      <p class="line">${o.line}</p>
      <div class="vp"><iframe title="Homepage TV, ${o.name}"></iframe></div>
    </section>`).join('');
  const cards = OPTS.map((o) => ({ o, el: box.querySelector(`[data-o="${o.id}"]`) }));
  cards.forEach((c) => { c.frame = c.el.querySelector('iframe'); });
  const PICK = 'fx-plugin';
  box.querySelector(`[data-o="${PICK}"] .mine`).hidden = false;

  const dims = () => st.size.split('x').map(Number);
  // the keys view: the lit plugin's words column at true size (from the frame itself, so every option is framed alike)
  function crop(c) {
    const d = c.doc, info = d && d.querySelector('.ww-panel.is-active .ww-info');
    if (!info) return null;
    const r = info.getBoundingClientRect();
    return { x: Math.max(0, Math.round(r.left - 26)), y: Math.max(0, Math.round(r.top - 22)), h: Math.round(r.height + 44) };
  }
  function layout() {
    const [W, H] = dims();
    const one = !!st.zoom;
    cards.forEach((c) => (c.el.hidden = one && c.o.id !== st.zoom));
    box.style.setProperty('--cols', one ? 1 : 2);
    requestAnimationFrame(() => cards.forEach((c) => {
      if (c.el.hidden) return;
      const vp = c.el.querySelector('.vp');
      const cr = st.view === 'keys' && crop(c);
      if (cr) {
        vp.style.height = `${cr.h}px`;
        Object.assign(c.frame.style, { width: `${W}px`, height: `${H}px`, transform: `translate(${-cr.x}px, ${-cr.y}px)` });
      } else {
        const k = Math.min(1, vp.clientWidth / W);
        vp.style.height = `${Math.round(H * k)}px`;
        Object.assign(c.frame.style, { width: `${W}px`, height: `${H}px`, transform: `scale(${k})` });
      }
      c.el.querySelector('.zoom').textContent = one ? 'Back to all four' : 'Zoom';
    }));
  }

  function send(c, detail) {
    const win = c.frame.contentWindow, wallEl = win && win.document.querySelector(WALL);
    if (wallEl) wallEl.dispatchEvent(new win.CustomEvent('ww:select', { detail }));
  }
  // the cart switch: what Cart.astro does to a key once its plugin is in the cart (class + label), nothing stored
  function cartState(c) {
    const d = c.doc; if (!d) return;
    d.querySelectorAll('.ww-panel .ww-cart').forEach((b) => {
      if (!b.hasAttribute('data-bench-idle')) b.setAttribute('data-bench-idle', b.textContent.trim());
      const on = st.cart === 'in';
      b.classList.toggle('is-in-cart', on);
      b.textContent = on ? 'In your cart' : b.getAttribute('data-bench-idle');
    });
  }
  function wire(c) {
    const doc = c.frame.contentDocument;
    c.doc = doc;
    doc.documentElement.id = 'wwcart';
    const s = doc.createElement('style');
    s.id = 'wwcart-style';
    s.textContent = '#cookie-banner, dialog.wd-modal, dialog.exit-gas, dialog.sub-modal, #support-chat, .cart-fab { display: none !important; }\n' + c.o.css;
    doc.head.appendChild(s);
    if (c.o.setup) c.o.setup(doc, c.frame.contentWindow);
    if (!document.querySelector('#chan button')) buildChannels(doc);
    send(c, { slug: st.slug });
    cartState(c);
    setTimeout(layout, 1300);
  }
  function waitFor(c, tries = 0) {
    const doc = c.frame.contentDocument;
    const wallEl = doc && doc.location.href !== 'about:blank' && doc.querySelector(WALL);
    if (wallEl && wallEl.dataset.wwLib === 'on' && doc !== c.old) return wire(c);
    if (tries < 200) setTimeout(() => waitFor(c, tries + 1), 150);
  }
  function load() {
    cards.forEach((c) => {
      c.old = c.frame.contentDocument;
      c.doc = null;
      c.frame.src = '/' + (st.slug ? `?plugin=${encodeURIComponent(st.slug)}` : '');
      waitFor(c);
    });
    layout();
  }

  function buildChannels(doc) {
    const rows = [...doc.querySelectorAll('[data-ww-pick]')];
    const slugs = rows.map((a) => a.getAttribute('href').replace(/^\//, ''));
    const names = rows.map((a) => a.querySelector('.ww-name').textContent.trim());
    const paid = new Set([...doc.querySelectorAll('.ww-panel')].filter((p) => p.querySelector('.ww-cart')).map((p) => p.dataset.wwPanel));
    document.getElementById('chan').innerHTML = slugs.map((s, i) => `<button type="button" data-slug="${s}" title="${paid.has(s) ? 'Has Add to cart' : 'Free: Product page only'}">${names[i] || s}${paid.has(s) ? ' $' : ''}</button>`).join('');
    document.querySelectorAll('#chan button').forEach((b) => (b.onclick = () => {
      st.slug = b.dataset.slug; save(); paint();
      cards.forEach((c) => send(c, { slug: st.slug }));
      setTimeout(layout, 1300);
    }));
    paint();
  }

  function paint() {
    document.querySelectorAll('#chan button').forEach((b) => b.classList.toggle('on', b.dataset.slug === st.slug));
    document.querySelectorAll('#size button').forEach((b) => b.classList.toggle('on', b.dataset.s === st.size));
    document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === st.view));
    document.querySelectorAll('#cart button').forEach((b) => b.classList.toggle('on', b.dataset.c === st.cart));
  }
  document.querySelectorAll('#size button').forEach((b) => (b.onclick = () => { st.size = b.dataset.s; save(); paint(); load(); }));
  document.querySelectorAll('#view button').forEach((b) => (b.onclick = () => { st.view = b.dataset.v; save(); paint(); layout(); }));
  document.querySelectorAll('#cart button').forEach((b) => (b.onclick = () => { st.cart = b.dataset.c; save(); paint(); cards.forEach(cartState); }));
  document.getElementById('empty').onclick = () => {
    try { localStorage.removeItem('revaudio_cart_v2'); } catch (e) {}
    st.cart = 'out'; save(); paint(); load();
  };
  cards.forEach((c) => (c.el.querySelector('.zoom').onclick = () => { st.zoom = st.zoom ? '' : c.o.id; save(); layout(); }));
  addEventListener('resize', layout);
  paint();
  load();
})();
</script>
</body>
</html>
