<!doctype html>
<!-- The set straight from above, orthographic: the layout guide the aerial art is painted over (drone/tools/ortho.cjs).
     ?rect=x0,z0,w,h in metres (image top = the smallest z, behind the shop), the window size = the image size. -->
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }
@font-face { font-family: Bebas; src: url(../../fonts/bebas.woff2) format("woff2"); }
@font-face { font-family: Oswald; src: url(../../fonts/Oswald-Variable.woff2) format("woff2"); font-weight: 200 700; }</style>
<canvas id="c"></canvas>
<script type="module">
import { THREE, buildWorld } from '../world.js';
const [x0, z0, w, h] = new URLSearchParams(location.search).get('rect').split(',').map(Number);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
const world = await buildWorld();
world.set({ uA: 0, quad: 0, feather: 0 });
const cam = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 1, 200);
cam.position.set(x0 + w / 2, 60, z0 + h / 2); cam.rotation.set(-Math.PI / 2, 0, 0); cam.updateMatrixWorld();
renderer.render(world.scene, cam);
window.done = true;
</script>
