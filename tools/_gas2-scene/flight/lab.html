<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAS 2 flight lab</title>
<style>
  @font-face { font-family: Oswald; src: url(../fonts/Oswald-Variable.woff2) format("woff2"); font-weight: 200 700; }
  html, body { margin: 0; background: #0d0806; color: #efe9df; font: 12px ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { display: block; }
  .p { position: fixed; right: 10px; top: 10px; width: 300px; background: rgba(18, 8, 4, .9); border: 1px solid #3a2410; border-radius: 8px; padding: 10px 12px; }
  .p label { display: grid; grid-template-columns: 52px 1fr 58px; gap: 6px; align-items: center; margin: 3px 0; }
  .p output { text-align: right; color: #e8c878; }
  .p button { margin-top: 8px; width: 100%; background: #2a1c10; color: #efe9df; border: 1px solid #3a2410; border-radius: 4px; padding: 6px; font: inherit; }
  body.shot .p { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="p" id="p"></div>
<script type="module">
// The flight lab: the projection-mapped station on its own. Pose sliders (or ?cam=x,y,z,yaw,pitch,roll,vfov), the path
// (?u=0..1), the projector mix (?s=0..1, s=1 = A only), ?b=0 = without the aerial (the proxy render that the aerial is made
// from; with ?road=0 the pole sign + telephone line stay out of it), ?bimg= = another hover photo, ?w=&h= = canvas size at
// DPR 1 (?shot = no panel, title "ready" when drawn: headless captures).
import { THREE, makeWorld, loadSet, POSE_A, POSE_B, poseAt, applyPose, makeCamera } from './world.js';
import { makeRoadside } from './roadside.js';
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const W = num('w', innerWidth), H = num('h', innerHeight), shot = q.has('shot');
if (shot) document.body.classList.add('shot');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(shot ? 1 : Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
const set = await loadSet({ aerial: q.get('b') === '0' ? null : (q.get('bimg') || 'img/aerial-blue.webp') });
const texB = set.aerial;
const world = makeWorld(set);
if (!texB) world.uniforms.minRes.value = num('minres', 3);
world.uniforms.dbg.value = num('mask', 0);
const road = q.get('road') === '0' ? null : await makeRoadside(world);   // ?road=0 = the blockout without the roadside objects
if (road) road.update(num('lit', 9));
const cam = makeCamera(POSE_B);
const pose = q.has('cam') ? (() => { const v = q.get('cam').split(',').map(Number); return { pos: v.slice(0, 3), yaw: v[3], pitch: v[4], roll: v[5] || 0, vfov: v[6] || 56 }; })()
  : q.has('u') ? poseAt(num('u', 0)) : { ...POSE_B, pos: [...POSE_B.pos] };
let s = num('s', texB ? 0 : 1);
const draw = () => {
  applyPose(cam, pose); cam.aspect = 1.5; cam.clearViewOffset();
  // keep the 3:2 frame and letterbox it into the canvas like the page's .scene would cover it
  const sw = Math.max(W, H * 1.5), sh = sw / 1.5;
  cam.setViewOffset(sw, sh, (sw - W) / 2, (sh - H) / 2, W, H);
  world.setS(s); renderer.render(world.scene, cam);
};
draw();
if (shot) { document.title = 'ready'; }
else {
  const p = document.getElementById('p');
  const rows = [['x', 0, -60, 60, .1], ['y', 1, 0.3, 120, .1], ['z', 2, -20, 200, .1], ['yaw', 'yaw', -60, 60, .1], ['pitch', 'pitch', -90, 20, .1], ['roll', 'roll', -20, 20, .1], ['vfov', 'vfov', 20, 90, .1]];
  p.innerHTML = rows.map(([n, k, a, b, st]) => `<label>${n}<input type="range" data-k="${k}" min="${a}" max="${b}" step="${st}"><output></output></label>`).join('')
    + `<label>path u<input type="range" id="u" min="0" max="1" step=".001" value="0"><output></output></label>`
    + `<label>mix s<input type="range" id="s" min="0" max="1" step=".001"><output></output></label>`
    + `<button id="copy">COPY POSE</button>`;
  const sync = () => p.querySelectorAll('input[data-k]').forEach(i => { const k = i.dataset.k, v = isNaN(+k) ? pose[k] : pose.pos[+k]; i.value = v; i.nextElementSibling.textContent = (+v).toFixed(2); });
  p.querySelectorAll('input[data-k]').forEach(i => i.oninput = () => { const k = i.dataset.k; if (isNaN(+k)) pose[k] = +i.value; else pose.pos[+k] = +i.value; sync(); draw(); });
  const su = p.querySelector('#s'); su.value = s; su.nextElementSibling.textContent = s;
  su.oninput = () => { s = +su.value; su.nextElementSibling.textContent = s.toFixed(3); draw(); };
  const uu = p.querySelector('#u');
  uu.oninput = () => { Object.assign(pose, poseAt(+uu.value)); if (texB) { s = +uu.value; su.value = s; } uu.nextElementSibling.textContent = (+uu.value).toFixed(3); sync(); draw(); };
  p.querySelector('#copy').onclick = () => navigator.clipboard.writeText(JSON.stringify({ pos: pose.pos.map(v => +v.toFixed(2)), yaw: pose.yaw, pitch: pose.pitch, roll: pose.roll, vfov: pose.vfov }));
  sync(); addEventListener('resize', () => location.reload());
}
</script>
</body>
</html>
