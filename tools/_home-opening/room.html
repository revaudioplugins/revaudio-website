     labelled block for every future Higgsfield image; scrolling walks down the aisle and locks onto the live TV.
     No credits spent. Not in the Astro build (tools/). Serve the worktree root:
     python3 -m http.server <port> --bind 127.0.0.1  ->  /tools/_home-opening/room.html
     Keys: H hides the dock, T the tuning panel, L the labels, W the neon wireframe. Three.js r170 is vendored (MIT). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root { --bg-0: #0b0a09; --fg: #efe9df; --brass-bright: #e8c878; --honey: #f6c85d; --nav-h: 41px; --vh: 100vh; --walk-px: 220vh; --tv-r: 34px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-0); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .nav { position: fixed; inset: 0 0 auto 0; height: var(--nav-h); z-index: 50; background: #0b0a09; }
  .nav img { display: block; width: 100%; height: 100%; }
  .opening { position: relative; height: calc(var(--vh) + var(--walk-px)); }
  .cam { position: sticky; top: 0; height: var(--vh); overflow: hidden; background: #060509; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl.is-hot { cursor: pointer; }
  .tv-live { position: absolute; left: 0; top: var(--nav-h); width: 100%; height: calc(var(--vh) - var(--nav-h)); display: block;
    opacity: 0; border-radius: var(--tv-r); pointer-events: none; }
  .tv-live.is-on { opacity: 1; }

  .read-b { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
  .rb-kick { margin: 0 0 .35em; font: 600 clamp(11px, 1.05vw, 15px)/1 Inter, sans-serif; letter-spacing: .32em; color: var(--brass-bright); }
  .rb-head { margin: 0; font: 400 clamp(54px, 8.6vw, 156px)/.86 "Bebas Neue", sans-serif; letter-spacing: .02em; color: #efe3c6;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.9)) drop-shadow(0 0 14px rgba(0,0,0,.75)) drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
  .rb-head em { font-style: normal; color: #ff8a3c; }
  .rb-sig { display: inline-block; margin: .05em 0 0 22%; font: 400 clamp(24px, 2.7vw, 44px)/1 "Yellowtail", cursive; color: var(--honey);
    transform: rotate(-6deg); text-shadow: 0 2px 3px rgba(0,0,0,.8); }
  .below img { display: block; width: 100%; height: auto; }

  .dock { position: fixed; left: 12px; bottom: 12px; z-index: 60; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 24px);
    font: 600 11px/1 Inter, sans-serif; letter-spacing: .04em; }
  .dock[hidden], .panel[hidden] { display: none; }
  .chip { appearance: none; border: 1px solid #3a3027; background: rgba(14,11,9,.9); color: #cfc6b8; padding: 8px 10px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: #e8c878; color: #1a140e; border-color: #e8c878; }
  .chip.tag { cursor: default; background: rgba(40,70,40,.9); border-color: #4f8a4f; color: #d6ffd6; }
  .panel { position: fixed; right: 12px; bottom: 12px; top: calc(var(--nav-h) + 12px); z-index: 61; width: 300px; overflow: auto;
    background: rgba(12,10,8,.95); border: 1px solid #3a3027; border-radius: 10px; padding: 12px 14px; font: 12px/1.35 Inter, sans-serif; color: #d8cfc2; }
  .panel.wide { width: min(560px, calc(100vw - 24px)); }
  .panel h3 { margin: 10px 0 6px; font: 400 15px/1 "Bebas Neue"; letter-spacing: .08em; color: var(--brass-bright); }
  .panel label { display: grid; grid-template-columns: 1fr 56px; gap: 2px 8px; margin: 6px 0; }

  .slots { width: 100%; border-collapse: collapse; font-size: 11px; }
  .slots td, .slots th { border-bottom: 1px solid #2a231d; padding: 4px 4px; text-align: left; vertical-align: top; }
  .slots th { color: #e8c878; font-weight: 600; }

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.23/dist/lenis.min.js" integrity="sha384-iiCtod6ZId6zT42Bar9EFXNKZh8X4VliWYWFOuY3/t1AxCvLejXExXcbluoc57CJ" crossorigin="anonymous"></script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ---------- settings (Tune panel; COPY SETTINGS bakes them) ----------
const DEF = {
  roomW: 6.5, roomH: 4.4,                // the room, metres (its length follows the walk: see layout)
  lens: 32,                              // vertical field of view, degrees
  tvW: 1.1, tvY: 1.55,                   // the TV: width, centre height (metres)
  tvStart: 5,                            // TV width on the first screen, % of the screen width (Dan's pick)
  walkLen: 220, ease: 2.0, feel: 0.35,    // scroll length (% screen); in-out power; 0 = steady metres, 1 = the TV grows steadily
  sway: 1, neon: 1, lamps: 1, tvGlow: 1, bloom: 0.9, fog: 0.035, dust: 1,
  labels: 1, wire: 0, mirror: 1, readB: 0, snap: 1,
};
const REBUILD = new Set(['roomW', 'roomH', 'tvW', 'tvY', 'lens', 'tvStart']);
const KEY = 'hoRoom:v1';
const S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// the live TV, captured per screen size (glass inset unused here; r = the bezel's corner radius, px)
const CAPS = [
  { w: 1141, nav: 41, tag: '1141x636', navW: 1141, r: 34 },
  { w: 1440, nav: 41, tag: '1440x900', navW: 1440, r: 34 },
  { w: 1920, nav: 41, tag: '1920x1080', navW: 1920, r: 34 },
  { w: 390, nav: 58, tag: '390x844', navW: 390, r: 12, phone: true },
];
const pickCap = (vw) => vw < 760 ? CAPS[3] : CAPS.slice(0, 3).reduce((a, c) => Math.abs(c.w - vw) < Math.abs(a.w - vw) ? c : a);

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeIO = (t, k) => t < 0.5 ? Math.pow(2 * t, k) / 2 : 1 - Math.pow(2 * (1 - t), k) / 2;
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- renderer ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping; // the TV's pixels must come out as captured at the lock
const camera = new THREE.PerspectiveCamera(S.lens, 1, 0.05, 200);
const renderPass = new RenderPass(new THREE.Scene(), camera);
const composer = new EffectComposer(renderer);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(512, 512), S.bloom, 0.55, 0.9);
composer.addPass(renderPass); composer.addPass(bloomPass); composer.addPass(new OutputPass());

let cap = null, scene = null, W = {}; // W = the built world
const L = {};                          // layout numbers
const tvImg = new Image();

// ---------- small canvas textures ----------
function concreteTex(base, amount = 16) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  const im = g.getImageData(0, 0, 256, 256), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * amount; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function floorTex(roomW) {
  // one 8 m stretch of floor: dark glaze (lets the mirror through), two lane lines, a dashed centre line
  const c = document.createElement('canvas'); c.width = 256; c.height = 1024;
  const g = c.getContext('2d'), px = 256 / roomW, py = 1024 / 8;
  g.fillStyle = 'rgba(16,13,18,0.74)'; g.fillRect(0, 0, 256, 1024);
  g.fillStyle = 'rgba(214,176,80,0.9)';
  for (const x of [-0.95, 0.95]) g.fillRect(128 + x * px - 0.04 * px, 0, 0.08 * px, 1024);
  g.fillStyle = 'rgba(235,228,214,0.55)';
  for (let y = 0; y < 8; y += 1) g.fillRect(128 - 0.025 * px, y * py, 0.05 * px, 0.5 * py);
  const t = new THREE.CanvasTexture(c); t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function labelSprite(text, cat) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 112;
  const g = c.getContext('2d');
  g.font = '600 34px Inter, sans-serif';
  const w = Math.min(620, g.measureText(text).width + 40);
  g.fillStyle = 'rgba(10,8,12,0.78)'; g.beginPath(); g.roundRect((640 - w) / 2, 20, w, 72, 14); g.fill();
  g.fillStyle = cat === 'music' ? '#c9b8ff' : cat === 'garage' ? '#ffc08f' : '#e8e2d6';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 320, 57);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false }));
  sp.scale.set(1.3, 0.23, 1); sp.renderOrder = 10;
  return sp;
}
function signTex() {
  const c = document.createElement('canvas'); c.width = 1400; c.height = 340;
  const g = c.getContext('2d');
  g.font = '400 250px "Bebas Neue", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.shadowColor = 'rgba(255,90,40,0.9)'; g.shadowBlur = 40;
  g.strokeStyle = '#ff5a2a'; g.lineWidth = 16; g.strokeText('REVAUDIO', 700, 180);
  g.shadowBlur = 0; g.strokeStyle = '#ffd9c4'; g.lineWidth = 5; g.strokeText('REVAUDIO', 700, 180);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function tvTexture() {
  // the captured live TV with the bezel's round corners cut out
  if (!tvImg.complete || !tvImg.naturalWidth) return null;
  const c = document.createElement('canvas'); c.width = tvImg.naturalWidth; c.height = tvImg.naturalHeight;
  const g = c.getContext('2d'), k = c.width / innerWidth;
  g.beginPath(); g.roundRect(0, 0, c.width, c.height, cap.r * k); g.clip(); g.drawImage(tvImg, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

// side -1 = left wall, 1 = right wall; z = metres from the end wall (the TV's wall) along the room; w along the wall.

    { id: 'L04', cat: 'music', label: 'Amp stack (head + 4x12)', side: -1, z: z(0.82), w: 0.8, h: 1.55, d: 0.42 },
    { id: 'L05', cat: 'garage', label: 'Red tool chest', side: -1, z: z(0.74), w: 0.8, h: 1.0, d: 0.5 },
    { id: 'L06', cat: 'music', label: 'Compressor rack (VU meters)', side: -1, z: z(0.74), w: 0.6, h: 0.9, d: 0.48, y: 1.45 },

}
// the far end: a mix station round the TV (x across the room, d out from the end wall)
function endTable() {

// ---------- build the room ----------
function disposeScene(sc) {
  sc.traverse((o) => {
    o.geometry?.dispose?.();
    const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of ms) { for (const k of ['map', 'alphaMap']) m[k]?.dispose?.(); m.dispose?.(); }
    if (o.isReflector) o.getRenderTarget?.().dispose?.();
  });
}
function build() {
  if (scene) disposeScene(scene);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060509);
  scene.fog = new THREE.FogExp2(0x0b0812, S.fog);
  renderPass.scene = scene;
  const Wd = S.roomW, H = S.roomH, Lr = L.roomLen;
  W = { props: [], labels: [], neonMats: [], neonLights: [], lampLights: [], lampMats: [], slots: [] };

  scene.add(new THREE.HemisphereLight(0x46346e, 0x0b0907, 0.42));

  // walls, ceiling, end wall, near wall
  const wallMat = new THREE.MeshStandardMaterial({ map: concreteTex('#3b3439'), roughness: 0.93 });
  wallMat.map.repeat.set(Lr / 2.5, H / 2.5);
  const ceilMat = new THREE.MeshStandardMaterial({ map: concreteTex('#211d24'), roughness: 0.95 });

// ---------- layout: the camera's start and end are worked out from the screen ----------
function layout() {
  const vw = innerWidth, vh = innerHeight;
  const c = pickCap(vw);

    cap = c;

    $('tvLive').src = tvImg.src; $('navImg').src = `assets/nav-${c.navW}.webp`; $('belowImg').src = `assets/below-${c.navW}.webp`;
  }
  const navH = cap.nav;

  renderer.setSize(vw, vh, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(vw, vh);

  Object.assign(L, { vw, vh, navH, tv, th, tvH, front, dEnd, d0, roomLen, span: front + d0 - 4, yEnd: S.tvY + (navH / 2) * wppEnd,

// ---------- intro + per-frame ----------
let t0 = performance.now();
const INTRO = { neon: [150, 1050], lamps: [450, 1150], sign: [800, 1500], tv: [1250, 1950], read: [1750, 2550] };
const env = (t, [a, b]) => clamp((t - a) / (b - a));
function flicker(t, win, salt) {
  if (reduced) return 1;
  const k = env(t, win);
  return k >= 1 ? 1 : k <= 0 ? 0 : (hash(Math.floor(t / 55) + salt) < k * k * 1.2 ? 1 : 0.05);
}
let progress = 0, lastFrame = 0;
const _c = new THREE.Color();
function frame(now) {

  const e = easeIO(clamp(progress), S.ease), far = 1 - e;
  const locked = progress >= 0.999;
  $('tvLive').classList.toggle('is-on', locked);

  // camera: the distance to the TV blends steady metres with a steady growth of the TV; sway fades out by the lock
  const dLin = L.d0 + (L.dEnd - L.d0) * e, dGeo = L.d0 * Math.pow(L.dEnd / L.d0, e);

  camera.position.set(
    amp * (0.035 * Math.sin(now * 0.00037) + 0.012 * Math.sin(now * 0.0011 + 1)),
    S.tvY + (L.yEnd - S.tvY) * e + amp * 0.02 * Math.sin(now * 0.00029 + 0.7),
    L.front + d);
  camera.rotation.set(amp * 0.004 * Math.sin(now * 0.00023), amp * 0.006 * Math.sin(now * 0.00019 + 1.3), amp * 0.002 * Math.sin(now * 0.00031));

  const neonK = flicker(t, INTRO.neon, 3) * S.neon * hum;
  for (const m of W.neonMats) m.color.copy(m.userData.base).multiplyScalar(2.6 * neonK);
  for (const l of W.neonLights) l.intensity = 11 * neonK;
  const lampK = smooth(0, 1, env(t, INTRO.lamps)) * S.lamps;
  for (const l of W.lampLights) l.intensity = 16 * lampK;
  for (const m of W.lampMats) m.color.copy(m.userData.base).multiplyScalar(0.2 + 2.8 * lampK);
  const signK = flicker(t, INTRO.sign, 11) * hum;

  const tk = reduced ? 1 : env(t, INTRO.tv), open = smooth(0.18, 0.62, tk);

  const la = tk >= 1 ? 0 : 1 - smooth(0.35, 0.75, tk);
  W.tv.lineMat.opacity = la;
  W.tv.line.visible = la > 0.001;
  W.tv.line.scale.set(S.tvW * clamp(tk / 0.18), 0.006 + L.tvH * open * 0.3, 1);

  // haze, glow and dust leave by the lock so the TV lands clean
  scene.fog.density = S.fog * far;

    for (let i = 0; i < sd.length; i++) {

      p.array[i * 3 + 1] = b[i * 3 + 1] + Math.sin(now * 0.00017 + sd[i] * 1.7) * 0.08;

  }

  const rb = $('readB');
  rb.style.display = S.readB ? '' : 'none';

  if (!W.tv || progress > 0.6) return false;
  ndc.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(W.tv.face).length > 0;
}
canvas.addEventListener('pointermove', (ev) => canvas.classList.toggle('is-hot', overTv(ev)));
canvas.addEventListener('click', (ev) => { if (overTv(ev)) glideTo(L.walkPx, 2.4); });

function raf(now) {
  if (lenis) lenis.raf(now);
  readScroll(); snapCheck(now); frame(now);
  requestAnimationFrame(raf);
}

// ---------- panels ----------
const SLIDERS = [
  ['The room'],
  ['roomW', 'Width (m)', 4, 10, 0.1], ['roomH', 'Height (m)', 3, 6.5, 0.1],
  ['The camera'],
  ['lens', 'Lens: vertical view (°)', 18, 70, 1], ['tvStart', 'TV on the first screen (% width)', 2, 15, 0.5],
  ['walkLen', 'Scroll length (% screen)', 100, 600, 10], ['ease', 'Ease (in-out power)', 1, 4, 0.1],
  ['feel', 'Walk feel: steady metres ↔ steady TV growth', 0, 1, 0.05], ['sway', 'Camera sway', 0, 3, 0.05],
  ['The TV'],
  ['tvW', 'TV width (m)', 0.5, 2.5, 0.05], ['tvY', 'TV centre height (m)', 0.8, 2.6, 0.05],
  ['Light'],
  ['neon', 'Neon strips', 0, 3, 0.05], ['lamps', 'Amber lamps', 0, 3, 0.05], ['tvGlow', 'TV glow', 0, 3, 0.05],
  ['bloom', 'Glow (bloom)', 0, 2.5, 0.05], ['fog', 'Haze', 0, 0.1, 0.002], ['dust', 'Dust', 0, 3, 0.05],
];
let rebuildTimer = 0;
function buildTune() {
  const body = $('tuneBody'); body.innerHTML = '';
  for (const row of SLIDERS) {
    if (row.length === 1) { const h = document.createElement('h3'); h.textContent = row[0]; body.appendChild(h); continue; }
    const [k, label, min, max, step] = row;
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span><output>${S[k]}</output><input type="range" min="${min}" max="${max}" step="${step}" value="${S[k]}">`;
    const inp = l.querySelector('input'), out = l.querySelector('output');
    inp.addEventListener('input', () => {
      S[k] = +inp.value; out.textContent = inp.value; save();
      if (REBUILD.has(k)) { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 120); } else layout();
    });
    body.appendChild(l);
  }
  const sn = document.createElement('label');
  sn.innerHTML = `<span>Finish a half walk (snap)</span><output></output><input type="checkbox" ${S.snap ? 'checked' : ''} style="grid-column:2">`;
  sn.querySelector('input').addEventListener('change', (ev) => { S.snap = ev.target.checked ? 1 : 0; save(); });
  body.appendChild(sn);
}
function buildSlots() {
  const rows = W.slots.map((s) => {
    const cls = s.cat === 'music' ? 'm' : s.cat === 'garage' ? 'g' : '';
    return `<tr><td class="${cls}">${s.id}</td><td>${s.label}</td><td>${s.size.map((v) => +(+v).toFixed(2)).join(' × ')}</td><td>${s.need}</td></tr>`;
  }).join('');
  const n = W.slots.filter((s) => s.kind === 'cutout' || s.kind === 'texture').length;
  $('slotsBody').innerHTML = `<div class="note">${n} images to make (cut-outs + surfaces); the sign is code, the TV is live.</div>` +
    `<table class="slots"><thead><tr><th>Slot</th><th>What</th><th>Size (m)</th><th>The image</th></tr></thead><tbody>${rows}</tbody></table>`;
}
const togglePanel = (id) => { const p = $(id); p.hidden = !p.hidden; if (!p.hidden && id === 'tune') buildTune(); };
document.querySelectorAll('[data-flag]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.flag; S[k] = S[k] ? 0 : 1; save(); applyFlags(); }));
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => togglePanel(b.dataset.close)));
$('btnTune').addEventListener('click', () => togglePanel('tune'));
$('btnSlots').addEventListener('click', () => togglePanel('slotsPanel'));
$('btnIntro').addEventListener('click', () => { glideTo(0, 0.01); t0 = performance.now() + 120; });
$('btnReset').addEventListener('click', () => { Object.assign(S, DEF); save(); rebuild(); buildTune(); });
const copy = async (btn, txt, label) => {
  try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copied ✓'; } catch (e) { prompt('Copy:', txt); }
  setTimeout(() => { btn.textContent = label; }, 1600);
};
$('btnCopy').addEventListener('click', () => copy($('btnCopy'), JSON.stringify(S, null, 1), 'Copy settings'));
$('btnCopySlots').addEventListener('click', () => copy($('btnCopySlots'), JSON.stringify(W.slots, null, 1), 'Copy slot list (JSON)'));
addEventListener('keydown', (ev) => {
  if (ev.target.closest && ev.target.closest('input, select, textarea')) return;
  const k = ev.key.toLowerCase();
  if (k === 'h') $('dock').hidden = !$('dock').hidden;
  if (k === 't') togglePanel('tune');
  if (k === 'l') { S.labels = S.labels ? 0 : 1; save(); applyFlags(); }
  if (k === 'w') { S.wire = S.wire ? 0 : 1; save(); applyFlags(); }
});
let resizeTimer = 0;
const rebuild = () => { layout(); build(); };
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rebuild, 150); });
tvImg.addEventListener('load', applyTvTexture);

// fonts first (the sign and the labels are drawn with them), then the room
await Promise.race([Promise.all([document.fonts.load('400 64px "Bebas Neue"'), document.fonts.load('600 34px Inter')]), new Promise((r) => setTimeout(r, 1500))]);
rebuild();
t0 = performance.now();
requestAnimationFrame(raf);
</script>
</body>
</html>
