<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIFT Toy Dash — bench</title>
<!--
  DRIFT before/after player, bench round 1 (2026-10-14, Claude Code revaudio-02, Yoni's request).
  A 1980s tabletop racing toy (Tomy Turbo) in DRIFT's black + neon violet:
    wheel hub      = START / STOP (the hero)
    gear shifter   = pick the track: 1 VOCALS · 2 KEYS · 3 SYNTH · 4 GUITAR · 5 PERC, N = stop
    DRIFT toggle   = DRIFT ON (the pre-rendered DRIFT setup) / BYPASS (the original)
    CRT            = the track's waveform (L above, R below) + a race road whose car sits where the sound sits
    cluster        = TACHO (level), SPEED, FUEL (clip left), TRIP (time), PAN meter, DRIFT / BYPASS lamps
  One track at a time. Only the current track's two files are in memory (the iPhone rule).
  SOUND: Yoni's 10 bounces (2026-10-14) via tools/drift-player/prep_audio.py -> public/drift-player/.
  Serve the worktree root over http (fonts): python -m http.server 8795, open /bench/drift-player-bench.html
  ?layout=phone forces the phone arrangement.
-->
<style>
@font-face{font-family:'Drift Press';src:url(../public/fonts/drift/PressStart2P-Regular.ttf) format('truetype');font-display:block}
@font-face{font-family:'Drift Orbitron';src:url(../public/fonts/drift/Orbitron-SemiBold.ttf) format('truetype');font-display:block}
@font-face{font-family:'Drift Oswald';src:url(../public/fonts/drift/Oswald-var.latin.woff2) format('woff2');font-weight:200 700;font-display:block}
@font-face{font-family:'Drift Bangers';src:url(../public/fonts/drift/Bangers.latin.woff2) format('woff2');font-display:block}
@font-face{font-family:'Drift Mono';src:url(../public/fonts/drift/ShareTechMono.latin.woff2) format('woff2');font-display:block}
@font-face{font-family:'Drift JP';src:url(../public/fonts/drift/NotoSansJP-var.subset-v2.woff2) format('woff2');font-weight:100 900;font-display:block}

:root{
  /* DRIFT palette, verbatim from src/styles/drift.css */
  --d-ink:#07050b; --d-steel:#0e0515; --d-glass:#0f0418;
  --d-neon:#d23cff; --d-violet:#8a2be2; --d-mag:#e040c8; --d-hot:#ff4fd8;
  --d-lcd:#f24cf0; --d-crt:#d98bff; --d-pink-ink:#ffd1f8; --d-white-ink:#f6e8ff;
  --d-cyan:#5ee7ff; --d-cyan-ink:#c8f6ff; --d-red:#ff6b63;
  --d-fg:#d9c6ef; --d-fg-dim:#a58cc4; --d-jp:#8b62b8;
  --f-pix:'Drift Press','Press Start 2P',ui-monospace,monospace;
  --f-badge:'Drift Orbitron','Orbitron',sans-serif;
  --f-head:'Drift Oswald','Oswald',Impact,sans-serif;
  --f-chip:'Drift Bangers','Bangers',Impact,sans-serif;
  --f-spec:'Drift Mono','Share Tech Mono',ui-monospace,monospace;
  --f-ja:'Drift JP','Yu Gothic UI',Meiryo,sans-serif;
  --snap:cubic-bezier(.2,.9,.25,1.25);
  /* the toy's two plastics */
  --tub-hi:#d06cff; --tub-1:#9a33ea; --tub-2:#6a1cb4; --tub-3:#3d0b70; --tub-4:#22053f;
  --blk-1:#1d1724; --blk-2:#110c17; --blk-3:#07050b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#09060d url(../src/assets/seasons/drift/plate-tile.png) repeat;
  background-size:400px auto;
  color:var(--d-fg); font-family:var(--f-spec);
  min-height:100vh;
}
.sec{max-width:1180px;margin:0 auto;padding:48px 16px 80px}
.sechead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.marquee{font-family:var(--f-pix);font-size:12px;color:var(--d-pink-ink);text-shadow:0 0 3px #fff8,0 0 22px rgba(210,60,255,.6);letter-spacing:.08em}
.ja{font-family:var(--f-ja);color:var(--d-jp);font-size:14px;letter-spacing:.2em}
.rule{flex:1;height:2px;background:linear-gradient(90deg,rgba(210,60,255,.7),transparent)}
h2{font-family:var(--f-head);font-weight:600;font-size:clamp(30px,5vw,54px);line-height:1.02;margin:6px 0 6px;color:var(--d-white-ink);text-transform:uppercase;letter-spacing:.01em}
h2 .l2{color:var(--d-hot);text-shadow:0 0 18px rgba(255,79,216,.45)}
.lede{font-size:17px;color:var(--d-fg-dim);margin:0 0 28px}

/* ---------- the stage: fixed design px, scaled to the column (transform, never zoom) ---------- */
.fit{position:relative;width:100%}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.L-desk{width:1100px;height:884px}
.L-phone{width:420px;height:1180px}
.mod{position:absolute;transform-origin:0 0}

/* ---------- CLUSTER ---------- */
.cluster{width:510px;height:314px}
.cluster .plate{position:absolute;inset:0}
.cluster .glass{position:absolute;left:26px;top:26px;width:458px;height:262px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 120%,#1a0826,#0a0510 60%,#060309)}
.cluster svg{position:absolute;inset:0}
.cluster .glare{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(162deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 28%,transparent 29%),
             radial-gradient(60% 40% at 80% 0%,rgba(210,60,255,.10),transparent)}
.seg-on{fill:var(--d-lcd);filter:url(#lcdGlow)}
.lcd-print{font-family:'Drift Orbitron';font-size:11px;fill:#e9d6ff;letter-spacing:.12em}
.lcd-num{font-family:'Drift Orbitron';font-size:13px;fill:#e9d6ff}

/* ---------- SCREEN ---------- */
.screen{width:490px;height:343px}
.screen .bezel{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.screen .tube{position:absolute;left:58px;top:42px;width:374px;height:260px;border-radius:22px;overflow:hidden;background:#06020b;
  box-shadow:0 0 0 2px #000,0 0 26px rgba(210,60,255,.0);transition:box-shadow .4s}
.screen.on .tube{box-shadow:0 0 0 2px #000,0 0 30px rgba(210,60,255,.28)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%}
.screen .crt{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
    radial-gradient(120% 110% at 50% 50%,transparent 58%,rgba(0,0,0,.75) 100%),
    linear-gradient(158deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 22%,transparent 23%);
  box-shadow:inset 0 0 28px rgba(0,0,0,.9),inset 0 0 3px rgba(255,255,255,.15)}
.livery{position:absolute;font-family:var(--f-chip);letter-spacing:.06em;font-size:15px;color:var(--d-hot);text-shadow:0 0 10px rgba(255,79,216,.5)}

/* ---------- the toy body: AI shell (tools/drift-player/gen_assets.py shell-3, cut by process_assets.py) ---------- */
.shell{background:url(../public/drift-player/img/shell.webp) 0 0/100% 100% no-repeat;filter:drop-shadow(0 30px 40px rgba(4,0,10,.75)) drop-shadow(0 0 40px rgba(138,43,226,.18))}
/* the page's own plate (section-plate-s1: black steel, X screws, violet inner line), 9-sliced */
.plate9{border-style:solid;border-color:transparent;border-image:url(../src/assets/seasons/drift/section-plate-s1.png) 330 fill / 30px stretch}
.chip{position:absolute;font-family:var(--f-ja);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--d-hot);padding:2px 7px;
  background:rgba(40,4,40,.75);border:1px solid rgba(255,79,216,.45);border-radius:3px;text-shadow:0 0 8px rgba(255,79,216,.6)}
.checker{position:absolute;width:64px;height:30px;transform:skewX(-22deg);
  background:conic-gradient(var(--d-hot) 25%,#6a1cb4 0 50%,var(--d-hot) 0 75%,#6a1cb4 0) 0 0/16px 15px}
.slogan{position:absolute;font-family:var(--f-badge);font-size:10px;letter-spacing:.32em;color:#8f7aa6}
.slogan b{color:var(--d-hot);letter-spacing:.05em;margin-right:8px;font-weight:400}

/* ---------- WHEEL: a 1:1 copy of the plugin's (Drift Source/ui/public/index.html "steering wheel (PAN)", 5.2.10):
   same art (assets/jdm/wheel.png = src/assets/seasons/drift/wheel.png, md5 fb8a981e), same 790 px build, same fixed
   light (.wlight masked by the wheel, .wlfix counter-rotates: light never rotates), same live hub mark, same glow.
   The module is scaled as a whole, so every plugin number stays as is. ---------- */
.wheelclip{width:790px;height:790px;pointer-events:none}
.wheel{position:absolute;inset:0;cursor:grab;pointer-events:auto;border-radius:50%;clip-path:circle(50%);touch-action:none}
.wheel:active{cursor:grabbing}
.wheel .ind{position:absolute;inset:0;will-change:transform}
.wheel .wheelimg{width:100%;height:100%;display:block;pointer-events:none;user-select:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.8))}
.wheel{--wl-hi:.55;--wl-sh:.55}
.wheel .wlight{position:absolute;inset:0;pointer-events:none;will-change:transform;
  -webkit-mask-image:url(../src/assets/seasons/drift/wheel.png);mask-image:url(../src/assets/seasons/drift/wheel.png);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:overlay}
.wheel .wlfix{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;will-change:transform;
  background:
    radial-gradient(circle at 33% 24%, rgba(255,246,228,var(--wl-hi)) 0, rgba(255,246,228,calc(var(--wl-hi)*.35)) 22%, rgba(128,128,128,0) 48%),
    radial-gradient(circle at 70% 82%, rgba(0,0,0,var(--wl-sh)) 0, rgba(0,0,0,calc(var(--wl-sh)*.4)) 26%, rgba(128,128,128,0) 55%),
    linear-gradient(160deg, rgba(255,255,255,calc(var(--wl-hi)*.25)) 0%, rgba(128,128,128,0) 45%, rgba(0,0,0,calc(var(--wl-sh)*.3)) 100%)}
.wheel .mark{position:absolute;left:50%;top:50%;transform:translate(-50%, calc(-50% + 19px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:170px;pointer-events:none}
.wheel .mark .dm{font-family:var(--f-badge);font-weight:800;line-height:1;white-space:nowrap;color:#e8e0d0;
  font-size:22px;letter-spacing:0.14em;text-indent:0.14em;
  text-shadow:0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.16), 0 0 10px rgba(180,107,255,0.79)}
.wheel .mark .kana{font-family:'Yu Gothic UI','Meiryo','Hiragino Kaku Gothic ProN',sans-serif;font-weight:700;line-height:1;white-space:nowrap;
  color:#cf9dff;opacity:.72;font-size:12px;letter-spacing:.3em;text-indent:.3em;text-shadow:0 0 8px rgba(180,107,255,.55)}
.wheelGlow{position:absolute;left:100px;top:100px;width:590px;height:590px;border-radius:50%;
  background:radial-gradient(circle, rgba(138,43,226,.30) 0%, rgba(138,43,226,.12) 42%, transparent 65%)}

/* ---------- PLAY / STOP: DRIFT's own arcade caps (mm_cap_green / mm_cap_red), in a well under the screen ---------- */
.tpmod{width:156px;height:84px;border-radius:14px;
  background:linear-gradient(180deg,#09060d,#140e1a);box-shadow:inset 0 5px 12px rgba(0,0,0,.95),inset 0 -1px 0 rgba(230,210,255,.12),0 1px 0 rgba(230,210,255,.10)}
.cap{position:absolute;top:7px;width:56px;height:56px;border:0;padding:0;border-radius:50%;cursor:pointer;
  background:center/100% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));transition:transform .09s var(--snap),filter .15s}
.cap::before{content:"";position:absolute;inset:-5px;border-radius:50%}
.cap:hover{filter:brightness(1.1) drop-shadow(0 3px 4px rgba(0,0,0,.7));transform:translateY(-1px)}
.cap:active{transform:translateY(4px);filter:brightness(.9)}
.cap-play{left:16px;background-image:url(../src/assets/seasons/drift/mm_cap_green.png)}
.cap-stop{left:84px;background-image:url(../src/assets/seasons/drift/mm_cap_red.png)}
.cap-stop:not(:active){filter:saturate(.3) brightness(.65) drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.tpmod.playing .cap-stop:not(:active){filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.cap-play[aria-pressed="true"]{filter:brightness(1.15) drop-shadow(0 0 12px rgba(120,255,140,.55))}
.cap-play.hint::before{animation:capPulse 1.1s ease-in-out infinite}
@keyframes capPulse{0%,100%{box-shadow:0 0 0 2px rgba(255,79,216,.25)}50%{box-shadow:0 0 0 3px var(--d-hot),0 0 22px rgba(255,79,216,.9)}}
.tp-word{position:absolute;top:66px;width:56px;text-align:center;font-family:var(--f-badge);font-size:9px;letter-spacing:.28em;color:#8f7aa6}

/* ---------- 80s / SYNTHWAVE dressing ---------- */
/* the scene behind the toy: striped sunset, wireframe mountains, neon floor (scrolls while it plays) */
.scene{position:absolute;left:0;top:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.sun{position:absolute;border-radius:50%;
  background:linear-gradient(180deg,rgb(255,186,110) 0%,#ff7ac8 38%,#ff4fd8 55%,#b23ce8 78%,#6a1cb4 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 22%,transparent 22% 24%,#000 24% 30%,transparent 30% 33%,#000 33% 38%,transparent 38% 42%,#000 42% 46%,transparent 46% 51%,#000 51%);
  mask-image:linear-gradient(180deg,#000 22%,transparent 22% 24%,#000 24% 30%,transparent 30% 33%,#000 33% 38%,transparent 38% 42%,#000 42% 46%,transparent 46% 51%,#000 51%);
  filter:drop-shadow(0 0 30px rgba(255,79,216,.55))}
.mtn{position:absolute;overflow:visible}
.floor{position:absolute;overflow:hidden}
.floor .grid{position:absolute;inset:0;transform:perspective(260px) rotateX(62deg);transform-origin:50% 0;
  background:
    linear-gradient(rgba(255,79,216,.75) 2px,transparent 2px) 0 0/100% 46px,
    linear-gradient(90deg,rgba(210,60,255,.55) 2px,transparent 2px) 50% 0/62px 100%;
  height:300%;animation:gridRun .9s linear infinite;animation-play-state:paused}
.scene.on .floor .grid{animation-play-state:running}
@keyframes gridRun{to{background-position:0 46px,50% 0}}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,6,13,.95),transparent 40%)}
/* neon tube round the toy body */
.shell{filter:drop-shadow(0 0 1.5px rgba(255,79,216,.95)) drop-shadow(0 0 16px rgba(255,79,216,.45)) drop-shadow(0 30px 40px rgba(4,0,10,.75))}
/* 80s speed stripes painted on the candy tub */
.stripes{height:22px;pointer-events:none;mix-blend-mode:screen;
  background:
    linear-gradient(180deg,transparent 0 2px,#ff4fd8 2px 6px,transparent 6px 9px,#b23ce8 9px 13px,transparent 13px 16px,#5ee7ff 16px 19px,transparent 19px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  opacity:.85;transform:skewX(-24deg)}
/* chrome logo */
.chrome{position:absolute;font-family:var(--f-badge);font-weight:800;font-size:46px;letter-spacing:.08em;line-height:1;font-style:italic;
  background:linear-gradient(180deg,#ffffff 0%,#d9f3ff 30%,#7d6bd0 49%,#1c0d38 51%,#3a1466 60%,#ff7ad8 82%,#fff3fb 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,235,255,.55);
  filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 12px rgba(255,79,216,.75)) drop-shadow(0 3px 0 #2a0750)}
.chrome-ja{position:absolute;font-family:var(--f-ja);font-weight:700;font-size:14px;letter-spacing:.42em;color:#5ee7ff;text-shadow:0 0 6px #5ee7ff,0 0 16px rgba(94,231,255,.6)}

/* ---------- DRIFT / BYPASS toggle (on the page's plate) ---------- */
.togmod{width:160px;height:176px;cursor:pointer}
/* 8-bit switch: one 40 x 44 pixel sprite drawn x4 (plate, lamps, nut, bat lever in 3 frames); the words are the pixel font */
.togmod canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.tog-word{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-pix);letter-spacing:.08em;pointer-events:none}
.tog-word.top{top:17px;font-size:12px}
.tog-word.bot{bottom:13px;font-size:9px}
.tog-word.off{color:#4f3f63;text-shadow:2px 2px 0 #0b0512}
.tog-word.lit{color:#fff;text-shadow:2px 2px 0 #6a1cb4,0 0 10px rgba(255,79,216,.95)}
.tog-word.lit.cy{color:#fff;text-shadow:2px 2px 0 #0b5a6a,0 0 10px rgba(94,231,255,.95)}
.togmod.hint canvas{animation:togpulse 1.1s steps(4) infinite}
@keyframes togpulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,79,216,0))}50%{filter:drop-shadow(0 0 12px rgba(255,79,216,.95))}}

/* ---------- VOLUME knob (AI render, flat light: the whole knob may turn) ---------- */
.volmod{width:120px;height:140px}
.knob{position:absolute;left:14px;top:6px;width:92px;height:92px;border-radius:50%;cursor:ns-resize;touch-action:none;filter:drop-shadow(0 7px 8px rgba(0,0,0,.7))}
.knob .rot{position:absolute;inset:0;background:url(../public/drift-player/img/volknob.webp) center/100% 100% no-repeat;will-change:transform}
.knob .ptr{position:absolute;left:50%;top:21px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--d-pink-ink);outline:1.5px solid rgba(14,8,20,.88);box-shadow:0 0 6px rgba(255,79,216,.85)}
.knob .lamp-lit{position:absolute;inset:18px;border-radius:50%;pointer-events:none;background:radial-gradient(60% 50% at 34% 26%,rgba(255,255,255,.22),transparent 70%)}
.vol-word{position:absolute;left:0;right:0;top:106px;text-align:center;font-family:var(--f-badge);font-size:10px;letter-spacing:.32em;color:#8f7aa6}

/* ---------- GEARBOX: H-pattern gate + drift shift knob ---------- */
.shiftmod{width:240px;height:330px}
.gtilt{position:absolute;left:0;top:0;width:240px;height:240px}
/* 8-bit gate frame: a 60 x 60 pixel plate drawn x4 (bevel, dither, pixel X-screws, neon-outlined slots) */
.gcv{position:absolute;inset:0;width:240px;height:240px;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 6px 0 rgba(8,2,14,.85)) drop-shadow(0 0 10px rgba(255,79,216,.28))}
.gate{position:absolute;inset:0;overflow:visible}
.gnum{position:absolute;width:30px;height:24px;margin:-12px 0 0 -15px;padding:0;border:0;background:none;cursor:pointer;
  font-family:var(--f-pix);font-size:13px;color:#4f3f63;text-shadow:2px 2px 0 #0b0512}
.gnum.sel{color:#fff;text-shadow:2px 2px 0 #6a1cb4,0 0 10px rgba(255,79,216,.95)}
.gnum.n0.sel{color:#fff;text-shadow:2px 2px 0 #0b5a6a,0 0 10px rgba(94,231,255,.95)}
/* 8-bit shift knob: a 26 x 32 pixel sprite drawn x3.5, crisp (image-rendering:pixelated), lit upper-left, gear on its face */
.sknob{position:absolute;left:0;top:0;width:89.6px;height:112px;cursor:grab;touch-action:none;z-index:4;will-change:transform;
  filter:drop-shadow(0 3px 0 rgba(10,0,20,.75)) drop-shadow(0 0 6px rgba(255,79,216,.55));transition:filter .25s}
.sknob.idle{filter:drop-shadow(0 3px 0 rgba(10,0,20,.75)) drop-shadow(0 0 6px rgba(94,231,255,.45))}
.sknob .vib{position:absolute;inset:0;will-change:transform}
.sknob canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:50% 100%}
.pxspark{position:absolute;left:0;top:0;width:6px;height:6px;z-index:6;pointer-events:none;image-rendering:pixelated}
.pxpop{position:absolute;left:0;top:0;z-index:7;pointer-events:none;white-space:nowrap;font-family:var(--f-pix);font-size:12px;color:#fff;
  text-shadow:2px 2px 0 #6a1cb4,0 0 10px rgba(255,79,216,.95),0 0 2px #ff4fd8;transform:translate(-50%,-50%)}
.pxpop.n0{text-shadow:2px 2px 0 #0b5a6a,0 0 10px rgba(94,231,255,.95)}
.sknob.drag{cursor:grabbing}
.sknob-sh{position:absolute;left:0;top:0;width:48px;height:12px;z-index:3;pointer-events:none;will-change:transform;background:rgba(4,0,10,.62);
  clip-path:polygon(16% 0,84% 0,84% 17%,100% 17%,100% 83%,84% 83%,84% 100%,16% 100%,16% 83%,0 83%,0 17%,16% 17%)}
/* shift-pattern tag: the names (engraved, lit when that gear is in) */
.gtag{position:absolute;left:16px;top:240px;width:208px;height:84px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;
  background:#120a1b;box-shadow:0 -4px 0 #6b4a88,-4px 0 0 #4a2f63,4px 0 0 #0b0512,0 4px 0 #0b0512,0 8px 0 rgba(8,2,14,.85),0 0 14px rgba(255,79,216,.22)}
.gtag button{display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;cursor:pointer;
  font-family:var(--f-pix);font-size:7px;letter-spacing:.04em;color:#6f5a86;text-align:left;text-shadow:1px 1px 0 #000}
.gtag button b{font-weight:400;font-size:10px;width:12px;color:#8f7aa6}
.gtag button.sel{color:#fff;text-shadow:1px 1px 0 #6a1cb4,0 0 8px rgba(255,79,216,.95)}
.gtag button.sel b{color:#ffd1f8}
.gtag button.n0.sel{text-shadow:1px 1px 0 #0b5a6a,0 0 8px rgba(94,231,255,.95)}
.gtag button.n0.sel b{color:#c8f6ff}

/* ---------- placement: desktop (stage 1100 x 884: 140 px of sky over the toy; the toy box is 1100 x 724) ---------- */
.L-desk .toy{position:absolute;left:0;top:140px;width:1100px;height:724px}
.L-desk .scene{width:1100px;height:884px}

<section class="sec" aria-labelledby="hear-h">
  <div class="sechead"><span class="marquee">HEAR IT</span><span class="ja" lang="ja">サウンド</span><span class="rule"></span></div>
  <h2 id="hear-h"><span>Same track,</span> <span class="l2">before and after.</span></h2>
  <p class="lede">Press PLAY, flip DRIFT on and off, shift gears for the next track.</p>

  <div class="fit" id="fit">
    <div class="stage L-desk" id="stage">
      <!-- the sky behind the toy -->
      <div class="scene" id="scene" aria-hidden="true">
        <canvas class="pxc" id="scv" width="344" height="276"></canvas>
      </div>

      <div class="toy">
      <div class="mod m-shell shell"></div>
      <canvas class="mod m-dash" id="dashPx" width="131" height="341" style="image-rendering:pixelated;image-rendering:crisp-edges"></canvas>
      <span class="mod m-chip1 chip" lang="ja" aria-hidden="true">速度</span>
      <span class="mod m-chip2 chip" lang="ja" aria-hidden="true">音量</span>
      <div class="mod m-stripes stripes" aria-hidden="true"></div>

      <!-- CLUSTER -->
      <div class="mod m-cluster cluster" aria-hidden="true">
        <canvas class="pxp" id="clPlate" width="128" height="79"></canvas>
        <div class="glass">
          <svg id="clsvg" viewBox="0 0 458 262" width="458" height="262" shape-rendering="crispEdges">
            <defs>
              <filter id="lcdGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.2" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g id="tacho"></g>
            <g id="boxes" fill="none" stroke="rgba(233,214,255,.38)" stroke-width="1.5">
              <rect x="342" y="12" width="102" height="92" rx="6"/>
              <rect x="132" y="98" width="92" height="34" rx="5"/>
              <rect x="132" y="138" width="92" height="28" rx="5"/>
              <rect x="236" y="98" width="196" height="88" rx="6"/>
              <rect x="342" y="194" width="102" height="56" rx="6"/>
              <rect x="16" y="194" width="316" height="56" rx="6"/>

            <text class="lcd-print" x="352" y="30">FUEL</text>
            <g id="pump" fill="none" stroke="#e9d6ff" stroke-width="1.6" opacity=".75">
              <rect x="356" y="44" width="22" height="30" rx="2"/><rect x="360" y="48" width="14" height="9" fill="#e9d6ff" stroke="none" opacity=".6"/>
              <path d="M378 52 h6 v18 a4 4 0 0 1 -8 0 v-6"/><rect x="352" y="74" width="30" height="5" fill="#e9d6ff" stroke="none" opacity=".6"/>
            </g>

            <text class="lcd-print" x="246" y="116">SPEED</text>

            <text class="lcd-print" x="388" y="178" font-size="10">MPH</text>
            <text class="lcd-print" x="352" y="210">TRIP</text>

            <text class="lcd-print" x="174" y="211" text-anchor="middle" font-size="10">PAN</text>

      <div class="mod m-chrome chrome" aria-hidden="true">DRIFT</div>
      <div class="mod m-chromeja chrome-ja" lang="ja" aria-hidden="true">ドリフト</div>
      <div class="mod m-slogan slogan" aria-hidden="true"><b>//////</b>SPEED SOUNDS BETTER</div>
      </div><!-- /toy -->

    </div>
  </div>
</section>
<p class="devbar">Bench round 2 · Yoni's 10 bounces (originals level-matched to the DRIFT files) ·
  <a href="?layout=desk">desktop</a> · <a href="?layout=phone">phone</a> · <a href="?">auto</a></p>

<script>
(() => {
'use strict';
/* ======================= config ======================= */
const AUDIO_BASE = '../public/drift-player/';   // peaks.json + audio/<id>-before.m4a, audio/<id>-after.m4a
const AUDIO_EXT = '.m4a';
const STEMS = [
  { id:'vocals', name:'VOCALS' }, { id:'keys', name:'KEYS' }, { id:'synth', name:'SYNTH' },
  { id:'guitar', name:'GUITAR' }, { id:'perc', name:'PERC' },
];
const qs = new URLSearchParams(location.search);

/* ======================= layout ======================= */
const PXG = 3.2;                       // the toy's pixel grid: 1 art pixel = 3.2 css px (desktop)
let sceneP = null, sceneDirty = true;
const fit = document.getElementById('fit'), stage = document.getElementById('stage');
function layout(){
  const w = fit.clientWidth;
  const forced = qs.get('layout');
  const phone = forced ? forced === 'phone' : w < 760;
  stage.classList.toggle('L-phone', phone); stage.classList.toggle('L-desk', !phone);
  const W = phone ? 420 : 1100, H = phone ? 1180 : 884;
  const s = Math.min(1, w / W);
  stage.style.transform = `scale(${s})`;
  stage.style.left = ((w - W * s) / 2) + 'px';
  fit.style.height = (H * s) + 'px';
  const sc = document.getElementById('scv'), sw = Math.round(W / PXG), sh = Math.round(H / PXG);
  if (sc.width !== sw || sc.height !== sh){ sc.width = sw; sc.height = sh; }
  sceneP = phone ? { cx: 210, cy: 104, r: 100, mtnTop: 40, mtnH: 56, floor: null }
                 : { cx: 550, cy: 176, r: 170, mtnTop: 96, mtnH: 110, floor: [838, 884] };
  sceneDirty = true;
}
addEventListener('resize', layout); layout();

/* ======================= cluster drawing ======================= */
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, parent) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent && parent.appendChild(e); return e; };
const GHOST = 'rgba(242,76,240,.07)';
function setSeg(e, on, col){ e.setAttribute('fill', on ? (col || '#f24cf0') : GHOST); e.setAttribute('filter', on ? 'url(#lcdGlow)' : ''); }

// TACHO: the toy's curve, rising from bottom-left then running flat to an arrow
const tachoG = document.getElementById('tacho'), tacho = [];
const TN = 18;
function tachoPt(i){
  if (i < 6){ const u = i / 6; const x0=34,y0=160,x1=40,y1=52,x2=126,y2=46;
    const x=(1-u)*(1-u)*x0+2*(1-u)*u*x1+u*u*x2, y=(1-u)*(1-u)*y0+2*(1-u)*u*y1+u*u*y2;
    const dx=2*(1-u)*(x1-x0)+2*u*(x2-x1), dy=2*(1-u)*(y1-y0)+2*u*(y2-y1); return {x,y,a:Math.atan2(dy,dx)}; }
  const v = (i - 6) / 11; return { x: 126 + v * 194, y: 46 - v * 6, a: Math.atan2(-6,194) };
}
for (let i = 0; i < TN; i++){
  const p = tachoPt(i), len = 14 + i * 1.2, wid = i < 6 ? 15 : 12;
  const r = el('rect', { x: -wid/2, y: -len, width: wid, height: len, rx: 1.5,
    transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${(p.a*180/Math.PI).toFixed(1)}) ` }, tachoG);
  // rect grows "outward" (up / left of the curve)
  tacho.push(r);
}
const tachoNums = { 0:'0', 3:'1', 6:'2', 9:'4', 12:'6', 15:'8' };
for (const k in tachoNums){ const p = tachoPt(+k); el('text', { class:'lcd-num', x: (p.x + Math.sin(p.a)*-16 + 2).toFixed(1), y: (p.y + Math.cos(p.a)*16 + 4).toFixed(1), 'text-anchor':'middle' }, tachoG).textContent = tachoNums[k]; }
el('path', { d:'M326 28 l16 12 l-16 12 z', fill:'#f24cf0', filter:'url(#lcdGlow)', opacity:.85 }, tachoG);
el('text', { class:'lcd-print', x:200, y:84, 'text-anchor':'middle' }, tachoG).textContent = 'TACHO';

// 7-segment digits (ghost segments stay faintly visible, like a real LCD)
const SEG = { '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g',' ':'' };
function makeDigits(g, n, w, h, t, gap){
  const out = [];
  const H = (y,x1,x2)=>`${x1},${y} ${x1+t/2},${y-t/2} ${x2-t/2},${y-t/2} ${x2},${y} ${x2-t/2},${y+t/2} ${x1+t/2},${y+t/2}`;
  const V = (x,y1,y2)=>`${x},${y1} ${x+t/2},${y1+t/2} ${x+t/2},${y2-t/2} ${x},${y2} ${x-t/2},${y2-t/2} ${x-t/2},${y1+t/2}`;
  const L=t/2, R=w-t/2, T=t/2, M=h/2, B=h-t/2, q=1.2;
  const pts = { a:H(T,L+q,R-q), b:V(R,T+q,M-q), c:V(R,M+q,B-q), d:H(B,L+q,R-q), e:V(L,M+q,B-q), f:V(L,T+q,M-q), g:H(M,L+q,R-q) };
  for (let i = 0; i < n; i++){
    const dg = el('g', { transform:`translate(${i*(w+gap)},0) skewX(-7)` }, g), segs = {};
    for (const k in pts) segs[k] = el('polygon', { points: pts[k] }, dg);
    out.push(segs);
  }
  return out;
}
function showDigits(ds, str){ ds.forEach((segs, i) => { const on = SEG[str[i]] || ''; for (const k in segs) setSeg(segs[k], on.includes(k)); }); }
const speedD = makeDigits(document.getElementById('speed'), 3, 30, 54, 6, 10);
const tripG = document.getElementById('trip');
const tripD = [ ...makeDigits(el('g',{},tripG), 1, 16, 28, 3.5, 0) ];
const tripD2 = makeDigits(el('g',{transform:'translate(28,0)'},tripG), 2, 16, 28, 3.5, 6);
const colon = [el('rect',{x:20,y:7,width:3,height:3},tripG), el('rect',{x:19,y:18,width:3,height:3},tripG)];

// FUEL ladder (drains as the clip plays)
const fuelG = document.getElementById('fuel'), fuel = [];
for (let i = 0; i < 6; i++){ const w = 12 + i * 3; fuel.push(el('rect', { x: 436 - w, y: 92 - i * 13, width: w, height: 9, rx: 1.5 }, fuelG)); }

// PAN meter
const panG = document.getElementById('pan'), pan = [];
const PN = 17;
for (let i = 0; i < PN; i++){ const mid = i === 8; pan.push(el('rect', { x: 38 + i * 16.2, y: mid ? 216 : 220, width: 11, height: mid ? 28 : 22, rx: 1.5 }, panG)); }

const lampDrift = document.getElementById('lampDrift'), lampByp = document.getElementById('lampByp');
function clusterLamps(){
  const r1 = lampDrift.children[0], t1 = lampDrift.children[1], r2 = lampByp.children[0], t2 = lampByp.children[1];
  r1.setAttribute('fill', state.drift ? '#f24cf0' : 'rgba(242,76,240,.06)'); r1.setAttribute('filter', state.drift ? 'url(#lcdGlow)' : '');
  t1.setAttribute('fill', state.drift ? '#14041a' : 'rgba(242,76,240,.16)');
  r2.setAttribute('fill', !state.drift ? '#5ee7ff' : 'rgba(94,231,255,.05)'); r2.setAttribute('filter', !state.drift ? 'url(#lcdGlow)' : '');
  t2.setAttribute('fill', !state.drift ? '#041318' : 'rgba(94,231,255,.16)');
}

/* ======================= state ======================= */
const state = { gear: 0, last: 1, drift: true, playing: false, vol: .8, touchedTog: false, touchedGear: false, playedAt: 0 };

/* ======================= the real bounces ======================= */
// tools/drift-player/prep_audio.py: <id>-before.m4a (the original, level-matched DOWN to the DRIFT file's loudness)
// + <id>-after.m4a (the DRIFT bounce, untouched), each padded PAD s on both sides; peaks.json = the loop length
// and the L/R waveform of both versions, so the screen draws before anything is decoded.
let M = null;
const manifestP = fetch(`${AUDIO_BASE}peaks.json`).then(r => r.json()).then(j => (M = j));
const BINS = 176;
function trackInfo(i){ return M ? M.tracks[STEMS[i].id] : null; }
async function loadReal(id, ctx){
  const get = async v => ctx.decodeAudioData(await (await fetch(`${AUDIO_BASE}audio/${id}-${v}${AUDIO_EXT}`)).arrayBuffer());
  const [before, after] = await Promise.all([get('before'), get('after')]);
  return { before, after };
}

/* ======================= audio engine ======================= */
let ctx = null, mix, volG, anL, anR, bufL, bufR;
let cur = null, curIdx = -1, srcs = null, t0 = 0, loadTok = 0;
function ensureCtx(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  mix = ctx.createGain(); volG = ctx.createGain(); volG.gain.value = state.vol * state.vol;
  mix.connect(volG).connect(ctx.destination);
  const sp = ctx.createChannelSplitter(2); mix.connect(sp);
  anL = ctx.createAnalyser(); anR = ctx.createAnalyser(); anL.fftSize = anR.fftSize = 1024;
  sp.connect(anL, 0); sp.connect(anR, 1);
  bufL = new Float32Array(1024); bufR = new Float32Array(1024);
}
async function loadStem(i){
  if (curIdx === i && cur) return cur;
  const tok = ++loadTok, id = STEMS[i].id;
  await manifestP; const b = await loadReal(id, ctx);
  if (tok !== loadTok) return null;
  cur = { ...b, dur: M.tracks[id].dur };
  curIdx = i; return cur;              // the previous track's buffers are dropped here (one track in memory)
}
function stopSources(){
  if (!srcs) return; const s = srcs; srcs = null; const now = ctx.currentTime;
  for (const g of [s.gB, s.gA]) { g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(0, now, .008); }
  for (const x of [s.b, s.a]) try { x.stop(now + .06); } catch (e) {}
}
function startSources(offset){
  stopSources();
  const gB = ctx.createGain(), gA = ctx.createGain();
  gB.gain.value = state.drift ? 0 : 1; gA.gain.value = state.drift ? 1 : 0;
  gB.connect(mix); gA.connect(mix);
  const P = M.pad;   // loop the window inside the padding, so the seam never hits the AAC priming gap
  const mk = (buf, g) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = P; s.loopEnd = P + cur.dur; s.connect(g); return s; };
  const b = mk(cur.before, gB), a = mk(cur.after, gA), when = ctx.currentTime + .03;
  b.start(when, P + offset); a.start(when, P + offset); t0 = when - offset;
  srcs = { b, a, gB, gA };
}
function position(){ if (!ctx || !cur) return 0; const d = cur.dur; return (((ctx.currentTime - t0) % d) + d) % d; }

async function setGear(g, opts = {}){
  if (g === state.gear && !opts.force) return;
  const was = state.gear; state.gear = g; drawGears(); moveKnob(g);
  if (!opts.silent) clunk(.9);
  if (g === 0){ stop(); return; }
  state.last = g; state.touchedGear = state.touchedGear || (was > 0);
  ensureCtx(); ctx.resume();
  const keep = state.playing && cur ? position() : 0;
  staticUntil = performance.now() + 170;
  const c = await loadStem(g - 1); if (!c || state.gear !== g) return;
  startSources(keep % c.dur);
  if (!state.playing){ state.playing = true; state.playedAt = performance.now(); }
  hubUI(); say(`${STEMS[g-1].name}, ${state.drift ? 'DRIFT on' : 'bypass'}`);
}
function stop(){
  if (ctx) stopSources();
  state.playing = false; hubUI(); say('Stopped');
}
function setDrift(on){
  state.drift = on; state.touchedTog = true;
  const tg = document.getElementById('tog'); tg.setAttribute('aria-checked', on);
  document.getElementById('wDrift').className = 'tog-word top ' + (on ? 'lit' : 'off');
  document.getElementById('wByp').className = 'tog-word bot cy ' + (on ? 'off' : 'lit');
  flipTog(on);
  clusterLamps(); clunk(1.3);
  if (srcs){ const now = ctx.currentTime; srcs.gA.gain.setTargetAtTime(on ? 1 : 0, now, .012); srcs.gB.gain.setTargetAtTime(on ? 0 : 1, now, .012); }
  say(on ? 'DRIFT on' : 'Bypass: the original');
}
// UI sound: a short plastic clunk, quiet, only on a switch
function clunk(f){
  if (!ctx) return; const sr = ctx.sampleRate, n = Math.floor(sr * .05), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(n*.08)) * .35 + Math.sin(i/sr*Math.PI*2*110*f) * Math.exp(-i/(n*.2)) * .5;
  const s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = .12 * state.vol; s.buffer = b; s.connect(g).connect(ctx.destination); s.start();
}

let wManual = 0;
(() => {

  const ang = e => { const r = w.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  w.addEventListener('pointerdown', e => { w.setPointerCapture(e.pointerId); d = { a0: ang(e), m0: wManual }; });

// ---- 8-bit toolkit: plates, screws and burst FX shared by the gearbox and the DRIFT switch
const BAY4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function pxPlate(g, w, h){
  const P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
  const cutC = (x, y) => { const cx = Math.min(x, w - 1 - x), cy = Math.min(y, h - 1 - y); return cx + cy < 3 && cx < 3 && cy < 3 && (cx === 0 || cy === 0 || cx + cy < 2); };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (cutC(x, y)) continue;
    let c = BAY4[y % 4][x % 4] < 5 ? '#241433' : '#1c1029';                       // dithered violet steel
    if (y === 0 || x === 0) c = '#7b58a0'; else if (y === 1 || x === 1) c = '#4a2f63';   // lit top-left bevel
    if (y === h - 1 || x === w - 1) c = '#07030b'; else if (y === h - 2 || x === w - 2) c = '#120a1b';
    P(x, y, c);
  }
}
function pxScrew(g, ox, oy){
  const M = ['.ab..', 'abxbc', 'bxxxc', 'bbxcc', '.ccc.'], C = { a: '#a593bb', b: '#5a4a6e', c: '#21182b', x: '#0b0612' };
  M.forEach((row, y) => [...row].forEach((k, x) => { if (C[k]){ g.fillStyle = C[k]; g.fillRect(ox + x, oy + y, 1, 1); } }));
}
function pxBurst(host, bx, by, cols, text, cyan){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 16; i++){
    const sp = document.createElement('i'); sp.className = 'pxspark'; sp.style.background = cols[i % cols.length];
    const a = Math.PI * 2 * i / 16 + Math.random() * .3, v = 34 + Math.random() * 30, dx = Math.cos(a) * v, dy = Math.sin(a) * v - 18;
    host.appendChild(sp);
    sp.animate([{ transform: `translate(${bx}px,${by}px)`, opacity: 1 },
                { transform: `translate(${bx + dx * .7}px,${by + dy * .7}px)`, opacity: 1, offset: .55 },
                { transform: `translate(${bx + dx}px,${by + dy + 26}px)`, opacity: 0 }],
               { duration: 520 + Math.random() * 160, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).onfinish = () => sp.remove();
  }
  const pop = document.createElement('div'); pop.className = 'pxpop' + (cyan ? ' n0' : ''); pop.textContent = text;
  pop.style.left = bx + 'px'; pop.style.top = (by - 56) + 'px'; host.appendChild(pop);
  pop.animate([{ transform: 'translate(-50%,-30%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.15)', opacity: 1, offset: .2 },
               { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .65 }, { transform: 'translate(-50%,-120%) scale(1)', opacity: 0 }],
              { duration: 900, easing: 'steps(18)', fill: 'forwards' }).onfinish = () => pop.remove();
}
function pxRecess(g, w, h){                       // a well cut into the dash: shadow top-left, lit lip bottom-right
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const cx = Math.min(x, w - 1 - x), cy = Math.min(y, h - 1 - y); if (cx + cy < 2 && cx < 2 && cy < 2) continue;
    let c = BAY4[y % 4][x % 4] < 4 ? '#0d0812' : '#09060d';
    if (y === 0 || x === 0) c = '#020104'; else if (y === 1 || x === 1) c = '#050308';
    if (y === h - 1 || x === w - 1) c = '#5a4472'; else if (y === h - 2 || x === w - 2) c = '#2a1d38';
    g.fillStyle = c; g.fillRect(x, y, 1, 1);

// turning parts (wheel, volume) are re-drawn into a small canvas every turn, then snapped to TURN_PAL: the grid never rotates.
// a fixed DRIFT palette for the turning parts: gunmetal greys with a violet cast + the violets + hub ink.
// Nearest colour per pixel (no per-channel rounding, which drifts dark suede toward green).
const TURN_PAL = ['#050308','#0c0811','#14101a','#1d1724','#2a2433','#3a3346','#4b4458','#6e6680','#8a8299','#b9b2c2','#e8e0d0','#ffffff',
                  '#24093f','#3d0b70','#4a3478','#5c1796','#6a4aa0','#8a2be2','#b46bff','#d98bff'].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
function quantise(g, W, H, pal){
  const d = g.getImageData(0, 0, W, H), p = d.data;
  for (let i = 0; i < p.length; i += 4){
    if (p[i + 3] < 128){ p[i + 3] = 0; continue; } p[i + 3] = 255;
    let best = 0, bd = 1e9; const r = p[i], gg = p[i + 1], b = p[i + 2];
    for (let k = 0; k < pal.length; k++){ const q = pal[k], dr = r - q[0], dg = gg - q[1], db = b - q[2], dd = 3 * dr * dr + 4 * dg * dg + 2 * db * db; if (dd < bd){ bd = dd; best = k; } }
    p[i] = pal[best][0]; p[i + 1] = pal[best][1]; p[i + 2] = pal[best][2];
  }
  g.putImageData(d, 0, 0);
}
const SPARK_HOT = ['#ff4fd8', '#5ee7ff', '#ffd1f8', 'rgb(255,186,110)', '#d23cff'], SPARK_CY = ['#5ee7ff', '#c8f6ff', '#2bb5d1'];

// ---- the DRIFT switch, 8-bit: frame 0 = up (DRIFT), 1 = mid (flipping), 2 = down (BYPASS)
const togcv = document.getElementById('togcv'), tgx = togcv.getContext('2d');
function drawTog(frame){
  const g = tgx, P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
  g.clearRect(0, 0, 50, 55); pxPlate(g, 50, 55);
  pxScrew(g, 2, 2); pxScrew(g, 43, 2); pxScrew(g, 2, 48); pxScrew(g, 43, 48);
  const lamp = (x, y, on, c, c2, c3) => {
    if (on){ g.fillStyle = c3; g.fillRect(x - 1, y, 7, 5); g.fillRect(x, y - 1, 5, 7); }
    g.fillStyle = on ? c : '#2a1338'; g.fillRect(x, y, 5, 5);
    g.fillStyle = on ? c2 : '#3f2350'; g.fillRect(x, y, 3, 1); g.fillRect(x, y, 1, 3);
    if (on){ P(x + 1, y + 1, '#ffffff'); P(x + 2, y + 1, '#ffffff'); }
  };
  lamp(7, 25, state.drift, '#ff4fd8', '#ffd1f8', 'rgba(255,79,216,.45)');
  lamp(38, 25, !state.drift, '#5ee7ff', '#c8f6ff', 'rgba(94,231,255,.45)');
  // octagonal chrome nut, lit upper-left, a dark socket in the middle
  for (let y = 22; y <= 35; y++) for (let x = 16; x <= 33; x++){
    const e = (y === 22 || y === 35) ? (x < 19 || x > 30) : (y === 23 || y === 34) ? (x < 18 || x > 31) : (y === 24 || y === 33) ? (x < 17 || x > 32) : false;
    if (e) continue;
    const outl = y === 22 || y === 35 || x === 16 || x === 33 || ((y === 23 || y === 34) && (x === 18 || x === 31)) || ((y === 24 || y === 33) && (x === 17 || x === 32));
    const v = ((33 - x) + (35 - y)) / 30 + (BAY4[y % 4][x % 4] / 16 - .5) * .14;
    P(x, y, outl ? '#0b0612' : v > .78 ? '#f4f0f8' : v > .6 ? '#c4bdcf' : v > .42 ? '#8a8299' : v > .26 ? '#4b4458' : '#2a2433');
  }
  g.fillStyle = '#07040b'; g.fillRect(22, 26, 6, 6);
  const shaft = (y0, y1) => { const C = ['#1c1724', '#6e6680', '#f4f0f8', '#ffffff', '#c4bdcf', '#7d7590', '#2a2433'];
    for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) C.forEach((c, k) => P(22 + k, y, c)); };
  const ball = (cx, cy, r) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++){
    const dx = x + .5 - cx, dy = y + .5 - cy, d = Math.hypot(dx, dy); if (d > r + .25) continue;
    const v = (-dx * .6 - dy * .8) / r;
    P(x, y, d > r - .8 ? '#14101a' : v > .55 ? '#ffffff' : v > .15 ? '#dcd6e3' : v > -.3 ? '#a59db3' : '#5e566d'); } };
  if (frame === 0){ shaft(17, 27); ball(25.5, 15, 4.5); }
  else if (frame === 2){ shaft(31, 41); ball(25.5, 42.5, 4.5); }
  else ball(25.5, 29, 5.6);
}
let togAnim = 0;
function flipTog(on){
  clearTimeout(togAnim); drawTog(1);
  togAnim = setTimeout(() => {
    drawTog(on ? 0 : 2);
    const r = PXG; pxBurst(tog, 25.5 * r, (on ? 15 : 42.5) * r, on ? SPARK_HOT : SPARK_CY, on ? 'DRIFT ON!' : 'BYPASS', !on);

// gearbox: a drift car's H gate. 1 3 5 across the top, 2 4 across the bottom, N in the middle (= stop).
// 8-bit: the plate is flat and pixel-true (60 x 60 px drawn x4), so the gate sits on the 4 px grid.
const GX = [78.4, 120, 161.6], GY = [65.6, 120, 174.4];         // gate columns / rows, css px (240 x 240) = pixel centres 24 37 50 / 20 37 54 on the 3.2 grid
const SLOT = { 1:[0,0], 2:[0,2], 3:[1,0], 4:[1,2], 5:[2,0], 0:[1,1] };
const gp = g => [GX[SLOT[g][0]], GY[SLOT[g][1]]];
const SEGS = [ [GX[0],GY[0],GX[0],GY[2]], [GX[1],GY[0],GX[1],GY[2]], [GX[2],GY[0],GX[2],GY[1]], [GX[0],GY[1],GX[2],GY[1]] ];
const TILT = 0, PERSP = 700;   // flat: proj() is the identity
function proj(x, y){ const dy = y - 120, z = dy * Math.sin(TILT), s = PERSP / (PERSP - z); return [120 + (x - 120) * s, 120 + dy * Math.cos(TILT) * s, s]; }
// the gate frame: plate, screws, slots cut out with a neon pixel outline (pink; cyan while in N)
const gcv = document.getElementById('gcv'), gcx = gcv.getContext('2d');
function drawGate(){
  const g = gcx, W = 75, slot = new Uint8Array(W * W);
  g.clearRect(0, 0, W, W); pxPlate(g, W, W);
  pxScrew(g, 3, 3); pxScrew(g, 67, 3); pxScrew(g, 3, 67); pxScrew(g, 67, 67);
  const P2 = v => Math.round(v / PXG - .5);
  for (const [a, b, c, d] of SEGS){
    for (let y = P2(Math.min(b, d)) - 2; y <= P2(Math.max(b, d)) + 2; y++) for (let x = P2(Math.min(a, c)) - 2; x <= P2(Math.max(a, c)) + 2; x++) slot[y * W + x] = 1;
  }
  const neon = state.gear === 0 ? ['#5ee7ff', '#1f7f95'] : ['#ff4fd8', '#6a1cb4'];
  const at = (x, y) => x >= 0 && y >= 0 && x < W && y < W && slot[y * W + x];
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++){
    if (at(x, y)){ g.fillStyle = at(x, y - 1) ? '#04010a' : '#170b22'; g.fillRect(x, y, 1, 1); continue; }
    if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)){ g.fillStyle = neon[0]; g.fillRect(x, y, 1, 1); }
    else if (at(x - 1, y - 1) || at(x + 1, y + 1) || at(x - 1, y + 1) || at(x + 1, y - 1) || at(x - 2, y) || at(x + 2, y) || at(x, y - 2) || at(x, y + 2)){
      g.fillStyle = neon[1]; g.fillRect(x, y, 1, 1); }
  }
}

// the knob: an 8-bit sprite. Collar on the slot, ball above it; shadow falls lower-right (lamp upper-left)
const sknob = document.getElementById('sknob'), sknobSh = document.getElementById('sknobSh'), shiftmod = sknob.closest('.shiftmod');
let kx = gp(0)[0], ky = gp(0)[1], kAnim = 0;
const KW = 28, KH = 35;
const kvib = document.createElement('div'); kvib.className = 'vib'; sknob.appendChild(kvib);
const kcv = document.createElement('canvas'); kcv.width = KW; kcv.height = KH; kvib.appendChild(kcv);
const kg = kcv.getContext('2d');
const KPAL = ['#14031f', '#3d0b70', '#5c1796', '#8a2be2', '#b23ce8', '#d23cff', '#ff4fd8', '#ffd1f8', '#ffffff'];
const KDIG = { 1:['010','110','010','010','111'], 2:['111','001','111','100','111'], 3:['111','001','111','001','111'],
               4:['101','101','111','001','001'], 5:['111','100','111','001','111'], 0:['101','111','111','111','101'] };
const BAYER = [[0, 2], [3, 1]];
let kLabel = -1, kShine = -1;
function drawKnobSprite(g, shine){
  kg.clearRect(0, 0, KW, KH);
  const P = (x, y, c) => { kg.fillStyle = c; kg.fillRect(x, y, 1, 1); };
  for (let y = 24; y < 35; y++) for (let x = 10; x < 19; x++){          // collar, knurled cyan rings
    let c = x === 10 ? '#4a4258' : x === 18 ? '#0e0a14' : x < 13 ? '#2e2838' : '#1c1724';
    if (y === 26 || y === 29 || y === 32) c = (x + y) % 2 ? '#5ee7ff' : '#1f7f95';

    if (lam > .965) idx = 8;

    P(x, y, KPAL[idx]);
  }
  const rows = KDIG[g] || KDIG[0], ox = 11, oy = 8, ink = g ? '#ffffff' : '#c8f6ff';

    rows.forEach((row, ry) => [...row].forEach((b, rx) => { if (b === '1'){ kg.fillStyle = col; kg.fillRect(ox + rx * 2 + off, oy + ry * 2 + off, 2, 2); } }));

  if (now < staticUntil){ for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 3){ const v = Math.random() * 200 | 0; c.fillStyle = `rgb(${v},${v * .7 | 0},${v})`; c.fillRect(x, y, 3, 2); } }
}
// pixel car, rear view (DRIFT violet, magenta tail-lights)
function drawCar(c, x, y, yaw, now){
  c.save(); c.translate(x, y); c.scale(1.45, 1.45); c.transform(1, 0, yaw * .6, 1, 0, 0);
  const R = (col, X, Y, w, h) => { c.fillStyle = col; c.fillRect(X, Y, w, h); };
  R('rgba(0,0,0,.45)', -22, 15, 44, 4);
  R('#0d0712', -21, 7, 9, 9); R('#0d0712', 12, 7, 9, 9);            // tyres
  R('#6a1cb4', -19, 0, 38, 12); R('#9a33ea', -19, 0, 38, 3);         // body
  R('#3d0b70', -13, -8, 26, 9); R('#c8b4e6', -10, -6, 20, 5);         // cabin + rear glass
  R('#220540', -22, -2, 44, 3);                                       // spoiler
  const tl = state.playing ? '#ff4fd8' : '#7a2a72';
  c.shadowColor = '#ff4fd8'; c.shadowBlur = state.playing ? 8 : 0; R(tl, -18, 4, 8, 3); R(tl, 10, 4, 8, 3); c.shadowBlur = 0;
  R('#f6e8ff', -4, 6, 8, 3);                                          // plate
  c.restore();
}
